# OpenClaw Home Assistant Addon v0.7.10.23 Configuration
# FIX: Inject HA Ingress base path into ControlUI HTML for Nabu Casa WebSocket support
name: OpenClaw Assistant
version: "0.7.10.23"
slug: openclaw_ha_addon
description: OpenClaw Home Assistant Addon (Bookworm Full-Stack)
url: https://github.com/chillkiller/openclaw-ha-addon
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
hassio_api: true
homeassistant_api: true
full_access: true
audio: true
video: true
apparmor: false

# Home Assistant Ingress (UI inside the add-on page)
ingress: true
ingress_port: 49200
panel_title: OpenClaw Assistant
panel_icon: mdi:robot

map:
  - addon_config:rw
  - share:rw
  - media:rw
options:
  timezone: "Europe/Berlin"

  # Enable web terminal inside Home Assistant (Ingress) via ttyd
  enable_terminal: true
  terminal_port: 7681
  enable_webui: true
  enable_tui: true
  tui_port: 7682
  enable_docs: true

  # Public base URL for opening the Gateway Web UI in a new tab (not embedded).
  # Recommended: NO trailing slash.
  # Example: "https://example.duckdns.org:12345" or "http://192.168.1.10:18789"
  gateway_public_url: ""

  # Optional: Home Assistant long-lived token (for local HA API scripts/tools)
  homeassistant_token: ""

  # Optional: outbound HTTP/HTTPS proxy for OpenClaw network access.
  # Example: "http://192.168.2.1:3128"
  http_proxy: ""

  # Optional: Router SSH defaults (leave empty if you don't need router automation)
  router_ssh_host: ""
  router_ssh_user: ""
  router_ssh_key_path: "/data/keys/router_ssh"

  # Cleanup stale session lock files left after crashes/restarts
  clean_session_locks_on_start: true
  clean_session_locks_on_exit: true

  # Gateway mode: local (run locally) or remote (connect to external gateway)
  gateway_mode: local
  gateway_remote_url: ""

  # Network mode — single source of truth for gateway.bind/auth/tls/tailscale
  # ingress_only: loopback + token auth (HA Ingress + terminal only)
  # lan_http: LAN HTTP without TLS on gateway_port
  # lan_https: LAN HTTPS with OpenClaw-native auto-generated TLS on gateway_port
  # tailnet_serve: Tailscale serve HTTPS
  # tailnet_funnel: Tailscale funnel HTTPS (password auth, public reachable)
  # reverse_proxy: loopback + trusted-proxy for external reverse proxy
  network_mode: ingress_only
  gateway_port: 18789

  # Optional: only used when network_mode == reverse_proxy
  # Comma-separated list of trusted proxy IPs/CIDRs
  gateway_trusted_proxies: ""

  # Optional: additional allowed origins for ControlUI (rarely needed)
  gateway_additional_allowed_origins: ""

  # Disable per-device Control UI auth ceremony (avoids pairing error 1008 on LAN)
  controlui_disable_device_auth: true

  # Enable OpenAI-compatible Chat Completions API endpoint (for HA Assist pipeline)
  enable_openai_api: false

  # Force IPv4-first DNS (most HAOS VMs lack IPv6 egress)
  force_ipv4_dns: true

  # Nginx access log verbosity: full or minimal
  nginx_log_level: minimal

  # mDNS/Bonjour configuration for LAN discovery
  # off: no mDNS advertisement
  # minimal: OpenClaw bundled bonjour plugin, core TXT keys only (default)
  # full: OpenClaw bundled bonjour plugin, verbose TXT metadata
  mdns_mode: minimal
  # Hostname to advertise (without .local; default: openclaw)
  mdns_host_name: "openclaw"

  # Gateway log output: mirror gateway stdout/stderr to HA add-on log window
  # When false (default), gateway logs go to /config/clawd/logs/gateway_startup.log only
  # When true, gateway output also visible on HA console (useful for debugging)
  gateway_log_to_console: false

  # Gateway log level: off (error only), info (default), debug (verbose)
  gateway_log_level: "info"

  # Trace log output: mirror trace stdout/stderr to HA add-on log window
  # When false (default), trace logs go to /config/clawd/logs/trace_startup.log only
  # When true, trace output also visible on HA console (useful for debugging)
  trace_log_to_console: false

  # Environment variables to pass to the gateway process at startup.
  # Format: list of objects with name/value fields.
  # Example:
  #   gateway_env_vars:
  #     - name: OPENAI_API_KEY
  #       value: "sk-abc123"
  # Reserved keys blocked: PATH, HOME, NODE_OPTIONS, OPENCLAW_*, proxy vars, LD_*
  # Limits: max 50 variables, max key 255 chars, max value 10000 chars.
  gateway_env_vars: []

  # Auto-configure MCP (Model Context Protocol) for Home Assistant.
  # When enabled + homeassistant_token set, registers HA as MCP server.
  auto_configure_mcp: false

  # ACPX harness infrastructure (Claude Code, Codex, OpenCode).
  # When enabled, the add-on installs wrapper launchers and the managed
  # npm project with @openclaw/acpx so OpenClaw can run coding agents via
  # the local ACPX backend. Existing user-configured coding agents are
  # preserved as-is; the add-on does not modify agents.list.
  acpx_enabled: true

  # Ollama base URL used by ACPX harness wrappers (claude/codex/opencode).
  # When no ANTHROPIC_API_KEY / OPENAI_API_KEY is configured, the wrappers
  # point the respective CLI at this URL and use 'ollama' as a placeholder
  # token. Set this to your remote Ollama instance (e.g.
  # http://192.168.178.34:11434) when running the harness against an
  # external Ollama server. When real API keys are present in
  # gateway_env_vars, this URL is ignored for the corresponding provider.
  ollama_base_url: "http://localhost:11434"

  # Optional: Space-separated list of apt packages to install at container startup.
  # Packages are reinstalled on each restart (not persistent in image).
  # Example: "ffmpeg postgresql-client"
  runtime_apt_packages: ""

  # Optional: Path to a custom init script that runs before OpenClaw starts.
  # Must be executable and idempotent. Mounted via /config/ or /share/.
  # Example: "/share/scripts/my-init.sh"
  custom_init_script: ""

schema:
  timezone: str
  enable_terminal: bool?
  terminal_port: int(1024,65535)?
  enable_webui: bool?
  enable_tui: bool?
  tui_port: int(1024,65535)?
  enable_docs: bool?
  gateway_public_url: str?
  homeassistant_token: str?
  http_proxy: str?
  router_ssh_host: str?
  router_ssh_user: str?
  router_ssh_key_path: str?
  clean_session_locks_on_start: bool?
  clean_session_locks_on_exit: bool?
  gateway_mode: list(local|remote)?
  gateway_remote_url: str?
  network_mode: list(ingress_only|lan_http|lan_https|tailnet_serve|tailnet_funnel|reverse_proxy)?
  gateway_port: int(1,65535)?
  gateway_trusted_proxies: str?
  gateway_additional_allowed_origins: str?
  controlui_disable_device_auth: bool?
  enable_openai_api: bool?
  force_ipv4_dns: bool?
  nginx_log_level: list(full|minimal)?
  mdns_mode: list(off|minimal|full)?
  mdns_host_name: str?
  gateway_log_to_console: bool?
  gateway_log_level: list(off|info|debug)?
  trace_log_to_console: bool?
  gateway_env_vars:
    - name: "match(^[A-Z_][A-Z0-9_]*$)"
      value: str
  auto_configure_mcp: bool?
  acpx_enabled: bool?
  ollama_base_url: str?
  runtime_apt_packages: str?
  custom_init_script: str?


