# OpenClaw Home Assistant App v0.7.13.35 Configuration
# Full OpenClaw runtime with Ingress Web UI, web terminal, Assist pipeline
# and MCP integration. Option reference lives in DOCS.md ("Configuration").
name: OpenClaw Assistant
version: "0.7.13.35"
slug: openclaw_ha_addon
description: Agentic AI assistant for Home Assistant — full OpenClaw runtime with Ingress Web UI, web terminal, Assist pipeline and MCP integration
url: https://github.com/chillkiller/openclaw-ha-addon
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
hassio_api: true
homeassistant_api: true
full_access: true
audio: true
video: true
apparmor: false

# Home Assistant Ingress (UI inside the app page)
ingress: true
ingress_port: 49200
panel_title: OpenClaw Assistant
panel_icon: mdi:robot

# Supervisor watchdog: restart the app when the Ingress front door stops
# answering. The probe originates from the Supervisor network (172.30.32.0/23),
# which the Ingress lockdown allowlist explicitly permits (since 0.7.12.1).
watchdog: tcp://[HOST]:49200

# Exclude regenerable caches and toolchains from Home Assistant backups:
# Homebrew, npm cache, node compile cache, __pycache__ and stale lock files
# are rebuilt on demand. User state (openclaw.json, agent databases, skills,
# sessions, clawd workspace, keys, certs) is always backed up.
backup_exclude:
  - .linuxbrew
  - .node_global
  - .npm
  - .cache
  - .node-compile-cache
  - __pycache__
  - "*.jsonl.lock"

map:
  - addon_config:rw
  - share:rw
  - media:rw

# -----------------------------------------------------------------------------
# Options layout (collapsible sections, v0.7.13.30)
#
# Top level: core gateway knobs + surface switches + the two plugin switches
# (acpx_enabled, harness_config_writer_enabled). Everything clusterable lives
# in a named group (rendered as a collapsible section in the HA options UI,
# max nesting depth 2 — which is why gateway_env_vars, a list-of-objects,
# CANNOT move into a group).
#
# * The web terminal is NOT an option: it is always present and working via
#   the Ingress as the maintenance/repair surface (the escape hatch). Only
#   its external port is configurable (terminal_port).
# * Model/provider defaults are harness-scoped, NOT Ollama-scoped — the
#   backend is any OpenAI-compatible endpoint (harness_base_url).
# * The stored options file may use the OLD flat layout (pre-migration
#   installs, incl. the ollama_* / acp_additional_allowed_agents key names).
#   run.sh normalizes both layouts and coalesces the renamed keys — see the
#   "Options layout normalization" block. Migration doc: DEPLOYMENT.md.
# -----------------------------------------------------------------------------
options:
  timezone: "Europe/Berlin"
  network_mode: ingress_only
  gateway_port: 18789
  # Gateway mode: local (run locally) or remote (connect to external gateway)
  gateway_mode: local
  gateway_env_vars: []

  # External port of the web terminal. The terminal itself is always on:
  # it appears in the Ingress UI and is the maintenance/repair surface
  # (the operator CLI escape hatch), so there is no enable/off switch.
  terminal_port: 7681
  enable_webui: true
  enable_docs: true

  ha_integration:
    # Optional: Home Assistant long-lived token (for local HA API scripts/tools)
    homeassistant_token: ""
    # Optional: outbound HTTP/HTTPS proxy for OpenClaw network access.
    # Example: "http://192.0.2.2:3128"
    http_proxy: ""
    # Enable OpenAI-compatible Chat Completions API endpoint (for HA Assist pipeline)
    enable_openai_api: false
    # Auto-configure MCP (Model Context Protocol) for Home Assistant — the
    # HA tools reach the ACP harnesses through this acpx-driven route.
    # When enabled + homeassistant_token set, registers HA as MCP server.
    auto_configure_mcp: false

  # ACPX is the BUNDLED OpenClaw plugin that provides the harness
  # infrastructure (codes Claude / Codex / OpenCode; `openclaw` itself stays
  # first-class). Its switch sits at top level, before the custom plugins
  # below. Existing user-configured coding agents are preserved as-is; the
  # app does not modify agents.list.
  #
  # v0.7.13.30, Owner decision 2026-10-15: acpx_enabled is the MASTER gate
  # for the whole acp(x) surface. acpx_enabled=false means NO writer and NO
  # binding deploy / config transfer, whatever their switches say. With the
  # master on, the two plugin switches below (writer/binding, both DEFAULT
  # OFF) act independently of each other (the writer does not need the
  # binding and vice versa).
  #
  # Without harness_base_url, every value in the `harness` group below
  # is IGNORED except the switches themselves (models, agents, utility_model
  # only apply once a base URL is configured).
  acpx_enabled: false
  # Deploy + register the bundled harness-config-writer plugin in OpenClaw
  # (generates the harness-native file/env config for local-provider
  # harnesses from its config.harnesses surface). Fine switch WITHIN the
  # acpx_enabled master gate, INDEPENDENT of acp_dashboard_binding_enabled
  # (neither follows nor drives it), DEFAULT OFF, and needs
  # harness_base_url to actually generate anything (empty base URL
  # = complete no-op). The legacy
  # plugins.entries['acp-dashboard-binding'].config.harnesses key is
  # migrated to plugins.entries['harness-config-writer'].config.harnesses
  # once at boot (idempotent, before the gateway reads the config).
  # Copy-not-clobber: only byte-identical previously GENERATED entries are
  # refreshed; operator hand-edits (and generated entries without the
  # configured base_url) are never overwritten — the first enabled boot
  # snapshots the pre-writer state of all managed harness config files, and
  # when the option goes off again the originals are restored automatically
  # (snapshot in /config/.openclaw/harness-config-writer-backup/).
  harness_config_writer_enabled: false
  # Shared custom-plugin/harness defaults (eine Ebene tiefer).
  # GATING (v0.7.13.30): ohne harness_base_url sind ALLE Werte hier
  # INERT — es gelten nur die Schalter (harness_config_writer_enabled /
  # acp_dashboard_binding_enabled). Modelle, Agents und utility_model werden
  # erst mit gesetzter Base URL übernommen.
  harness:
    # Backend endpoint for ALL local-provider harnesses (any OpenAI-compatible
    # API — not just Ollama): forwarded to the acpx wrapper templates and the
    # ambient Anthropic/OpenAI-compatible routing; also the harness-config-writer
    # ACTIVATOR (empty = nothing is generated; non-empty = writer generates
    # harness entries pointing at this URL). Default empty; the wrappers fall
    # back to the built-in http://localhost:11434 when unset.
    harness_base_url: ""
    # API key handed to generated harness entries (shared writer default).
    harness_api_key: ""
    # Shared harness default model. Applies to ALL non-excluded harnesses
    # (codex/opencode/claude keep their per-harness models below unless this
    # is set). Empty = per-harness defaults win.
    harness_model: ""
    # Utility-Modell-Override für agents.defaults.utilityModel in
    # openclaw.json — das Modell hinter den internen Gateway-Utility-Callouten
    # (u. a. der Session-Observer, der pro Turn ein strict-JSON-Digest liefert).
    # UNSET = kein Write (operator owns the value); gesetzt → einmalig gemerged
    # (operator wins on removal, never auto-cleared). Empfehlung bei
    # "session observer returned invalid JSON twice"-Live-Logs: ein Modell mit
    # sauberem strict-JSON-Output, z. B. "ollama/nemotron-3-super:cloud" oder
    # "ollama/deepseek-v4.1-flash:cloud".
    utility_model: ""
    # Per-harness model overrides (the 3 harnesses come bundled with acpx;
    # everything else is extra — see additional_agents below).
    # OpenCode (forge) harness model. Default: glm-5.3-flash:cloud
    harness_opencode_model: ""
    # Claude Code harness model. Feeds the ambient ANTHROPIC_MODEL fallback
    # AND the harness-config-writer claude default (legacy fallback:
    # gateway_env_vars OLLAMA_ACP_MODEL). Default: glm-5.3-flash:cloud
    harness_claude_model: ""
    # Codex (audit) harness model. Default: kimi-k2.7-code:cloud
    harness_codex_model: ""
    # Optional: comma-separated harness ids EXCLUDED from the shared defaults
    # above (e.g. "codex,opencode").
    harness_excluded_agents: ""
    # Optional: comma-separated ADDITIONAL agent/harness names to allow in
    # acp.allowedAgents besides the bundled claude/codex/opencode/openclaw
    # (e.g. "pi,colibri,gemini"). Custom agents must also exist in the
    # OpenClaw agent roster with runtime.type=acp pointing at a harness
    # adapter; the helper unions them in and never overwrites a user-owned
    # list. Empty = built-ins only.
    additional_agents: ""
    # Optional (Phase 2.15, GaRoN): deploy + register the bundled
    # acp-dashboard-binding plugin in OpenClaw (resolves dashboard/webchat
    # conversations to ACP harness sessions). Fine switch WITHIN the
    # acpx_enabled master gate (config transfer only happens while
    # acpx_enabled is true), INDEPENDENT of harness_config_writer_enabled
    # (neither follows nor drives it), DEFAULT OFF (v0.7.13.30).
    acp_dashboard_binding_enabled: false

  gateway_ext:
    # Public base URL for opening the Gateway Web UI in a new tab (not embedded).
    # Recommended: NO trailing slash.
    # Example: "https://example.duckdns.org:12345" or "http://192.0.2.10:18789"
    gateway_public_url: ""
    # Optional: only used when network_mode == remote
    gateway_remote_url: ""
    # Optional: only used when network_mode == reverse_proxy
    # Comma-separated list of trusted proxy IPs/CIDRs
    gateway_trusted_proxies: ""
    # Optional: additional allowed origins for ControlUI (rarely needed)
    gateway_additional_allowed_origins: ""

  logging_diag:
    # Gateway log output: mirror gateway stdout/stderr to HA app log window
    # When false (default), gateway logs go to /config/clawd/logs/gateway_startup.log only
    # When true, gateway output also visible on HA console (useful for debugging)
    gateway_log_to_console: false
    # Gateway log level: off (error only), info (default), debug (verbose)
    gateway_log_level: "info"
    # Trace log output: mirror trace stdout/stderr to HA app log window
    # When false (default), trace logs go to /config/clawd/logs/trace_startup.log only
    # When true, trace output also visible on HA console (useful for debugging)
    trace_log_to_console: false
    # Gateway startup trace (diagnostic, default false): when true, the boot log
    # gets per-phase/per-plugin breakdown lines ("startup trace: plugins.
    # runtime-post-bind …ms …" / "startup trace: plugin <id> …ms") — the tool
    # for post-mortem restart slowness (Kammerjäger: 64s runtime-post-bind).
    # Turn on, restart, read the app log, turn off again.
    gateway_startup_trace: false
    # Nginx access log verbosity: full or minimal
    nginx_log_level: minimal
    # Force IPv4-first DNS (most HAOS VMs lack IPv6 egress)
    force_ipv4_dns: true
    # mDNS/Bonjour configuration for LAN discovery
    # off: no mDNS advertisement
    # minimal: OpenClaw bundled bonjour plugin, core TXT keys only (default)
    # full: OpenClaw bundled bonjour plugin, verbose TXT metadata
    # The addon force-enables OpenClaw's native advertiser (OPENCLAW_DISABLE_BONJOUR)
    # because the addon runs host-networked — in a plain Docker container OpenClaw
    # silently disables it, which previously left openclaw.local unresolvable.
    # Note: the advertisement reports the gateway WS port (18790, loopback-only);
    # the WebUI over the LAN stays at https://openclaw.local:18789 (nginx TLS).
    mdns_mode: minimal
    # Hostname to advertise (without .local; default: openclaw)
    mdns_host_name: "openclaw"

  safety_nets:
    # --- v0.7.13 safety nets (TechArtDev 0.5.94 parity) ---
    # Pre-upgrade state backup: archive openclaw.json + state/ + agents/ before
    # the first boot of a changed OpenClaw version. Failing archive aborts the
    # version change (data fail-closed) unless this is turned off.
    abort_on_upgrade_backup_failure: true
    # How many pre-upgrade archives to keep (newest wins).
    upgrade_backup_keep: 3
    # Automatic `openclaw doctor --fix` runs per app start after 2 consecutive
    # failed gateway starts (openclaw.json snapshotted first). 0 disables.
    gateway_doctor_repair_max: 3

  runtime:
    # Optional: Space-separated list of apt packages to install at container startup.
    # Packages are reinstalled on each restart (not persistent in image).
    # Example: "ffmpeg postgresql-client"
    runtime_apt_packages: ""
    # Optional: Path to a custom init script that runs before OpenClaw starts.
    # Must be executable and idempotent. Mounted via /config/ or /share/.
    # Example: "/share/scripts/my-init.sh"
    custom_init_script: ""
    # Comma-separated list of hostnames blocked from outbound SSRP (OpenClaw 2026.9.1).
    # Leave empty to allow all hostnames. Example: "router.lan,192.0.2.1"
    blocked_hostnames: ""

  legacy:
    # Deprecated since OpenClaw 2026.9.8: gateway.controlUi.dangerouslyDisableDeviceAuth
    # is retired + ignored upstream; the app no longer writes this key (device pairing
    # always uses the normal Control-UI device flow). Option kept for config compatibility.
    # LEGACY / removal candidate (.31): removal forces affected installs to re-save
    # options once — do in the scheduled options migration, not as a solo drop.
    controlui_disable_device_auth: true

schema:
  timezone: str
  network_mode: list(ingress_only|lan_http|lan_https|tailnet_serve|tailnet_funnel|reverse_proxy)?
  gateway_port: int(1,65535)?
  gateway_mode: list(local|remote)?
  gateway_env_vars:
    - name: "match(^[A-Z_][A-Z0-9_]*$)"
      value: str
  terminal_port: int(1024,65535)?
  enable_webui: bool?
  enable_docs: bool?
  ha_integration:
    homeassistant_token: str?
    http_proxy: str?
    enable_openai_api: bool?
    auto_configure_mcp: bool?
  acpx_enabled: bool?
  harness_config_writer_enabled: bool?
  harness:
    harness_base_url: str?
    harness_api_key: str?
    harness_model: str?
    utility_model: str?
    harness_opencode_model: str?
    harness_claude_model: str?
    harness_codex_model: str?
    harness_excluded_agents: str?
    additional_agents: str?
    acp_dashboard_binding_enabled: bool?
  gateway_ext:
    gateway_public_url: str?
    gateway_remote_url: str?
    gateway_trusted_proxies: str?
    gateway_additional_allowed_origins: str?
  logging_diag:
    gateway_log_to_console: bool?
    gateway_log_level: list(off|info|debug)?
    trace_log_to_console: bool?
    gateway_startup_trace: bool?
    nginx_log_level: list(full|minimal)?
    force_ipv4_dns: bool?
    mdns_mode: list(off|minimal|full)?
    mdns_host_name: str?
  safety_nets:
    abort_on_upgrade_backup_failure: bool?
    upgrade_backup_keep: int(1,10)?
    gateway_doctor_repair_max: int(0,10)?
  runtime:
    runtime_apt_packages: str?
    custom_init_script: str?
    blocked_hostnames: str?
  legacy:
    controlui_disable_device_auth: bool?