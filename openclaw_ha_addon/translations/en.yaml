configuration:
  timezone:
    name: Timezone
    description: Timezone for the add-on (e.g., Europe/Berlin, America/New_York)
  
  enable_terminal:
    name: Enable Web Terminal
    description: Enable web terminal button inside Home Assistant (Ingress) via ttyd
  
  terminal_port:
    name: Terminal Port
    description: Port number for the web terminal (default - 7681). Change if this port conflicts with another service.
  
  gateway_public_url:
    name: Gateway Public URL
    description: Public base URL for opening the Gateway Web UI in a new tab (not embedded). Example - https://example.duckdns.org:12345 or http://192.168.1.10:18789
  
  homeassistant_token:
    name: Home Assistant Token
    description: Optional - Home Assistant long-lived token for local HA API scripts/tools

  http_proxy:
    name: Outbound HTTP Proxy
    description: Optional - Proxy URL for outbound HTTP/HTTPS requests (example - http://192.168.2.1:3128)
  
  router_ssh_host:
    name: Router SSH Host
    description: Optional - Router/firewall SSH hostname or IP address
  
  router_ssh_user:
    name: Router SSH User
    description: Optional - Router/firewall SSH username
  
  router_ssh_key_path:
    name: Router SSH Key Path
    description: Path to SSH private key for router access (default - /data/keys/router_ssh)
  
  clean_session_locks_on_start:
    name: Clean Session Locks on Start
    description: Cleanup stale session lock files left after crashes/restarts when add-on starts
  
  clean_session_locks_on_exit:
    name: Clean Session Locks on Exit
    description: Cleanup session lock files when add-on stops gracefully
  
  gateway_mode:
    name: Gateway Mode
    description: Gateway operation mode - local (run gateway locally, recommended) or remote (connect to a remote gateway)
    options:
      local: "Local (recommended)"
      remote: "Remote"

  gateway_remote_url:
    name: Remote Gateway URL
    description: Remote gateway WebSocket URL used when Gateway Mode is Remote (example - ws://192.168.1.20:18789 or wss://gateway.example.com:443)

  gateway_additional_allowed_origins:
    name: Additional Allowed Origins
    description: Comma-separated extra Control UI origins to merge into gateway.controlUi.allowedOrigins in lan_https mode (example - https://ha.example.com:8443,capacitor://localhost)

  controlui_disable_device_auth:
    name: Disable Control UI Device Pairing (lan_https)
    description: "When ON (recommended), sets gateway.controlUi.dangerouslyDisableDeviceAuth=true to skip per-device approval and avoid error 1008 in LAN HTTPS mode. Keep ON for home/trusted LAN. Turn OFF only when you want strict per-device pairing prompts on every new browser/device."

  network_mode:
    name: Network Mode
    description: "Sets gateway.bind, gateway.auth.mode, gateway.tls and gateway.tailscale.mode in one step."
    options:
      ingress_only: "Ingress Only (loopback + token, HA Ingress only)"
      lan_http: "LAN HTTP (no TLS on gateway_port)"
      lan_https: "LAN HTTPS (OpenClaw TLS on gateway_port, recommended for phones)"
      tailnet_serve: "Tailscale Serve (secure Tailnet HTTPS URL)"
      tailnet_funnel: "Tailscale Funnel (publicly reachable via Tailscale)"
      reverse_proxy: "Reverse Proxy (loopback + trusted-proxy for external proxy)"

  gateway_port:
    name: Gateway Port
    description: Port number for the OpenClaw gateway to listen on (default - 18789). In LAN and Tailscale modes this is the externally reachable port.

  gateway_trusted_proxies:
    name: Gateway Trusted Proxies
    description: Comma-separated trusted proxy IP/CIDR list, used only in Reverse Proxy network mode (example - 127.0.0.1,192.168.88.0/24).

  gateway_public_url:
    name: Public Gateway URL
    description: "Optional URL for the 'WebUI ↗' button in the Ingress title bar. Example - https://openclaw.local:18789 or https://my-device.tailnet.ts.net."

  mdns_mode:
    name: mDNS Mode
    description: "mDNS/Bonjour configuration for LAN discovery via OpenClaw's bundled bonjour plugin. 'off' disables mDNS, 'minimal' advertises the gateway service (default), 'full' advertises with all metadata."
    options:
      off: "Off (no mDNS)"
      minimal: "Minimal (advertise gateway service, default)"
      full: "Full (advertise with all metadata)"

  mdns_host_name:
    name: mDNS Host Name
    description: "Hostname for mDNS advertisement (without .local; default - openclaw). Sets OPENCLAW_MDNS_HOSTNAME and the container hostname so the TLS certificate includes the name."

  gateway_log_to_console:
    name: Show Gateway Log in HA Log
    description: When ON, gateway output (stdout/stderr) is mirrored to the Home Assistant add-on log window in addition to the log file. Useful for real-time diagnostics. When OFF, logs are written to file only.

  gateway_log_level:
    name: Gateway Log Level
    description: "Gateway log verbosity. 'off' shows only errors, 'info' (default) shows normal operation, 'debug' shows verbose details for troubleshooting."
    options:
      off: "Off (errors only)"
      info: "Info (default)"
      debug: "Debug (verbose)"

  trace_log_to_console:
    name: Show Boot Trace in HA Log
    description: When ON, the detailed boot sequence trace (set -x output) is mirrored to the Home Assistant add-on log window in addition to the log file. Very verbose — enable only for debugging.

  gateway_env_vars:
    name: Gateway Environment Variables
    description: Environment variables passed to the OpenClaw gateway process at startup (list entries with name/value in Home Assistant UI; max 50 variables, keys up to 255 characters, values up to 10,000 characters).

  auto_configure_mcp:
    name: Auto-Configure MCP for Home Assistant
    description: "When ON and Home Assistant Token is set, automatically registers Home Assistant as an MCP server on each startup. This lets OpenClaw control HA entities, services, and automations via the Model Context Protocol. Disable only if you manage mcporter configuration manually."

  runtime_apt_packages:
    name: Runtime APT Packages
    description: Optional - Space-separated list of APT packages to install at container startup. Packages are reinstalled on each restart (not persistent in image). Example - ffmpeg postgresql-client

  custom_init_script:
    name: Custom Init Script
    description: Optional - Path to an executable script that runs before OpenClaw starts. Must be idempotent. Mount via /config/ or /share/. Example - /share/scripts/my-init.sh