configuration:
  timezone:
    name: Timezone
    description: Timezone for the app (e.g., Europe/Berlin, America/New_York)
  network_mode:
    name: Network Mode
    description: Sets gateway.bind, gateway.auth.mode, gateway.tls and gateway.tailscale.mode in one step.
    options:
      ingress_only: Ingress Only (loopback + token, HA Ingress only)
      lan_http: LAN HTTP (no TLS on gateway_port)
      lan_https: LAN HTTPS (OpenClaw TLS on gateway_port, recommended for phones)
      tailnet_serve: Tailscale Serve (secure Tailnet HTTPS URL)
      tailnet_funnel: Tailscale Funnel (publicly reachable via Tailscale)
      reverse_proxy: Reverse Proxy (loopback + trusted-proxy for external proxy)
  gateway_port:
    name: Gateway Port
    description: Port number for the OpenClaw gateway to listen on (default - 18789). In LAN and Tailscale modes this is the
      externally reachable port.
  gateway_env_vars:
    name: Gateway Environment Variables
    description: Environment variables passed to the OpenClaw gateway process at startup (list entries with name/value in
      Home Assistant UI; max 50 variables, keys up to 255 characters, values up to 10,000 characters).
  gateway_mode:
    name: Gateway Mode
    description: Gateway operation mode - local (run gateway locally, recommended) or remote (connect to a remote gateway)
    options:
      local: Local (recommended)
      remote: Remote
  terminal_port:
    name: Terminal Port
    description: External port of the web terminal (default - 7681). The terminal itself is always on — it appears via the
      Ingress and is the maintenance/repair surface (the operator CLI escape hatch); only its port is configurable. Change
      if this port conflicts with another service.
  enable_webui:
    name: Enable WebUI
    description: Show the WebUI tab in the Ingress UI (OpenClaw Control Dashboard).
  enable_docs:
    name: Enable Docs
    description: Show the Docs tab in the Ingress UI (static documentation and live status).
  ha_integration:
    name: Home Assistant integration
    description: HA token, MCP, OpenAI API endpoint and proxy
    fields:
      homeassistant_token:
        name: Home Assistant Token
        description: Optional - Home Assistant long-lived token for local HA API scripts/tools
      http_proxy:
        name: Outbound HTTP Proxy
        description: Optional - Proxy URL for outbound HTTP/HTTPS requests (example - http://192.168.2.1:3128)
      enable_openai_api:
        name: Enable OpenAI-compatible API
        description: Expose the OpenAI-compatible Chat Completions API endpoint (for the HA Assist pipeline).
      auto_configure_mcp:
        name: Auto-Configure MCP for Home Assistant
        description: When ON and Home Assistant Token is set, automatically registers Home Assistant as an MCP server on each
          startup. This lets OpenClaw control HA entities, services, and automations via the Model Context Protocol. Disable
          only if you manage mcporter configuration manually.
  acpx_enabled:
    name: ACPX harness infrastructure
    description: Install ACPX wrapper launchers (Claude Code, Codex, OpenCode) so OpenClaw can run coding agents via the local ACPX
      backend. Existing user-configured coding agents are preserved as-is. Master switch of the whole acp(x) surface — OFF
      (default) = no writer/binding config transfer, their switches are inert; ON = the unlock, the writer/binding
      switches then decide independently.
  harness_config_writer_enabled:
    name: Harness Config Writer
    description: Optional (Repo-Split A2) - Deploy + register the bundled harness-config-writer plugin (generates the harness-native
      file/env configuration from config.harnesses). Independent opt-in switch, default OFF — it neither follows nor
      drives the ACP Dashboard Binding; only effective while acpx_enabled is on (master); a harness_base_url is required
      to actually generate anything (empty = complete no-op). Copies but never overwrites — only byte-identical previously
      GENERATED entries are refreshed; operator hand-edits and entries without the configured base URL are left intact.
      The first enabled session snapshots the managed harness files — switching it back off restores the originals
      automatically.
  harness:
    name: Harness (coding backends)
    description: Shared provider/model defaults for the bundled acpx harnesses (Claude Code, Codex, OpenCode) and the
      harness-config-writer. The endpoint is any OpenAI-compatible API — not just Ollama. Without a configured
      harness_base_url every value in this group is INERT — only the switches apply (models, agents and utility_model take
      effect once a base URL is set).
    fields:
      harness_base_url:
        name: Harness Base URL
        description: Backend endpoint for ALL local-provider harnesses (any OpenAI-compatible API — not just Ollama), e.g.
          http://192.168.178.34:11434. Doubles as the ACTIVATOR for the harness-config-writer - empty generates nothing (operator
          entries stay untouched). When unset the built-in fallback http://localhost:11434 applies.
      harness_api_key:
        name: Harness API Key
        description: API key used by generated harness entries (shared writer default). Empty = no key (e.g. local Ollama).
      harness_model:
        name: Default model (all harnesses)
        description: Shared harness default model. Applies to all NON-excluded harnesses (codex/opencode/claude keep their
          per-harness models below), when set. Empty = per-harness defaults win.
      utility_model:
        name: Utility model
        description: Optional - Override for agents.defaults.utilityModel in openclaw.json (the model behind internal gateway
          utility callouts, notably the session observer). UNSET = no write (operator owns the value); only set to a model
          with clean strict-JSON output.
      harness_opencode_model:
        name: OpenCode (forge) model
        description: Optional - Model for the OpenCode harness (forge). Default - glm-5.3-flash:cloud
      harness_claude_model:
        name: Claude Code model
        description: Optional - Model for the Claude Code harness (also feeds the ambient ANTHROPIC_MODEL fallback). Default
          - glm-5.3-flash:cloud
      harness_codex_model:
        name: Codex (audit) model
        description: Optional - Model for the Codex harness (audit). Default - kimi-k2.7-code:cloud
      harness_excluded_agents:
        name: Excluded harnesses
        description: Optional - Comma-separated harness ids EXCLUDED from the shared defaults above (e.g. "codex,opencode").
      additional_agents:
        name: Additional agents
        description: Optional - Comma-separated ADDITIONAL agent/harness names for acp.allowedAgents besides the bundled
          claude/codex/opencode/openclaw (e.g. "pi,colibri,gemini"). Custom agents must also exist in the OpenClaw agent
          roster with runtime.type=acp; the list is only unioned, never overwritten.
      acp_dashboard_binding_enabled:
        name: ACP Dashboard Binding
        description: Optional (Phase 2.15) - Deploy + register the bundled acp-dashboard-binding plugin (resolves dashboard/webchat
          conversations to ACP harness sessions). Independent opt-in switch, default OFF (v0.7.13.30) — it neither follows nor
          drives the Harness Config Writer; only effective while acpx_enabled=true (master switch); otherwise the config
          transfer stays off.
  gateway_ext:
    name: Gateway (external)
    description: URLs, trusted proxies and allowed origins for gateway access
    fields:
      gateway_public_url:
        name: Public Gateway URL
        description: Optional URL for the 'WebUI ↗' button in the Ingress title bar. Example - https://openclaw.local:18789
          or https://my-device.tailnet.ts.net.
      gateway_remote_url:
        name: Remote Gateway URL
        description: Remote gateway WebSocket URL used when Gateway Mode is Remote (example - ws://192.168.1.20:18789 or wss://gateway.example.com:443)
      gateway_trusted_proxies:
        name: Gateway Trusted Proxies
        description: Comma-separated trusted proxy IP/CIDR list, used only in Reverse Proxy network mode (example - 127.0.0.1,192.168.88.0/24).
      gateway_additional_allowed_origins:
        name: Additional Allowed Origins
        description: Comma-separated extra Control UI origins to merge into gateway.controlUi.allowedOrigins in lan_https
          mode (example - https://ha.example.com:8443,capacitor://localhost)
  logging_diag:
    name: Logging & diagnostics
    description: Console mirroring, log levels, startup trace, nginx, DNS and mDNS
    fields:
      gateway_log_to_console:
        name: Show Gateway Log in HA Log
        description: When ON, gateway output (stdout/stderr) is mirrored to the Home Assistant app log window in addition
          to the log file. Useful for real-time diagnostics. When OFF, logs are written to file only.
      gateway_log_level:
        name: Gateway Log Level
        description: Gateway log verbosity. 'off' shows only errors, 'info' (default) shows normal operation, 'debug' shows
          verbose details for troubleshooting.
        options:
          false: Off (errors only)
          info: Info (default)
          debug: Debug (verbose)
      trace_log_to_console:
        name: Show Boot Trace in HA Log
        description: When ON, the detailed boot sequence trace (set -x output) is mirrored to the Home Assistant app log window
          in addition to the log file. Very verbose — enable only for debugging.
      gateway_startup_trace:
        name: Startup trace in the app log
        description: Optional (diagnostic, default OFF) - When ON, the boot log gets a per-phase/per-plugin time breakdown
          ("startup trace - plugin ... ms"). Tool for post-mortem restart slowness. Turn on, restart, read the app log, turn
          off again.
      nginx_log_level:
        name: Nginx Access Log Verbosity
        description: full or minimal - minimal suppresses health-check polling noise.
      force_ipv4_dns:
        name: Force IPv4 DNS
        description: Prefer IPv4 for DNS resolution (most HAOS systems lack IPv6 egress).
      mdns_mode:
        name: mDNS Mode
        description: mDNS/Bonjour configuration for LAN discovery via OpenClaw's bundled bonjour plugin. 'off' disables mDNS,
          'minimal' advertises the gateway service (default), 'full' advertises with all metadata. The addon force-enables the native OpenClaw advertiser (host-networked here; in a plain Docker container it is silently disabled) — the LAN WebUI stays reachable at https://openclaw.local:18789.
        options:
          false: Off (no mDNS)
          minimal: Minimal (advertise gateway service, default)
          full: Full (advertise with all metadata)
      mdns_host_name:
        name: mDNS Host Name
        description: Hostname for mDNS advertisement (without .local; default - openclaw). Sets OPENCLAW_MDNS_HOSTNAME and
          the container hostname so the TLS certificate includes the name.
  safety_nets:
    name: Safety nets
    description: Upgrade state backups and automatic gateway repair
    fields:
      abort_on_upgrade_backup_failure:
        name: Abort on Upgrade-Backup Failure
        description: If ON (recommended), the app will not start a new OpenClaw version when the pre-upgrade state backup
          fails (e.g. full disk). Turn OFF only in emergencies; a rollback to the previous version may then be impossible.
      upgrade_backup_keep:
        name: Upgrade Backups to Keep
        description: How many pre-upgrade state archives are kept before the oldest is pruned (default 3).
      gateway_doctor_repair_max:
        name: Doctor Repair Runs per Start
        description: Maximum automatic `openclaw doctor --fix` runs per app start after 2 consecutive failed gateway starts.
          0 disables automatic repair.
  runtime:
    name: Runtime
    description: Apt packages, custom init script and SSRP hostname blocklist
    fields:
      runtime_apt_packages:
        name: Runtime APT Packages
        description: Optional - Space-separated list of APT packages to install at container startup. Packages are reinstalled
          on each restart (not persistent in image). Example - ffmpeg postgresql-client
      custom_init_script:
        name: Custom Init Script
        description: Optional - Path to an executable script that runs before OpenClaw starts. Must be idempotent. Mount via
          /config/ or /share/. Example - /share/scripts/my-init.sh
      blocked_hostnames:
        name: Blocked Hostnames
        description: Comma-separated list of hostnames blocked from outbound network access. Leave empty to allow all hostnames.
          Example - router.lan,192.168.178.1
  legacy:
    name: Legacy
    description: Retired options kept for compatibility
    fields:
      controlui_disable_device_auth:
        name: Deprecated — no effect (pairing always device-flow)
        description: Deprecated option (kept for compatibility). Since OpenClaw 2026.9.8 the gateway.controlUi.dangerouslyDisableDeviceAuth
          flag is retired and ignored upstream, and the app no longer writes it to the gateway config. Control-UI browsers
          always pair through the normal device flow in every network mode; no manual terminal steps are required.
