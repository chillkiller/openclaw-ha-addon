configuration:
  timezone:
    name: Fuso Horário
    description: Fuso horário do app (ex., America/Sao_Paulo, Europe/Berlin)
  network_mode:
    name: Modo de rede
    description: Fonte única de verdade para gateway.bind/auth/tls/tailscale. ingress_only - apenas HA Ingress e terminal;
      lan_http - HTTP na LAN sem TLS; lan_https - HTTPS na LAN com TLS automático; tailnet_serve/tailnet_funnel - HTTPS via
      Tailscale; reverse_proxy - proxy reverso externo.
  gateway_port:
    name: Porta do Gateway
    description: Número da porta para o gateway do OpenClaw escutar (padrão - 18789). Nos modos LAN e Tailscale esta é a
      porta acessível externamente.
  gateway_env_vars:
    name: Variáveis de Ambiente do Gateway
    description: Variáveis de ambiente passadas para o processo do gateway OpenClaw na inicialização (lista de entradas name/value
      na UI do Home Assistant; máximo de 50 variáveis, chaves com até 255 caracteres, valores com até 10.000 caracteres).
  gateway_mode:
    name: Modo do Gateway
    description: Modo de operação do gateway - local (executar gateway localmente, recomendado) ou remote (conectar a um gateway
      remoto)
    options:
      local: Local (recomendado)
      remote: Remoto
  terminal_port:
    name: Porta do Terminal
    description: Porta externa do terminal web (padrão - 7681). O terminal em si está sempre ligado — aparece via Ingress e
      é a superfície de manutenção/reparo (rota de fuga da CLI do operador); apenas a porta é configurável. Altere se esta
      porta conflitar com outro serviço.
  enable_webui:
    name: Ativar WebUI
    description: Mostrar a aba WebUI na interface Ingress (Painel de Controle do OpenClaw).
  enable_docs:
    name: Ativar Docs
    description: Mostrar a aba Docs na interface Ingress (documentação estática e status ao vivo).
  ha_integration:
    name: Home Assistant integration
    description: HA token, MCP, OpenAI API endpoint and proxy
    fields:
      homeassistant_token:
        name: Token do Home Assistant
        description: Opcional - Token de longa duração do Home Assistant para scripts/ferramentas da API local do HA
      http_proxy:
        name: Proxy HTTP de saída
        description: Opcional - URL de proxy para requisições HTTP/HTTPS de saída (exemplo - http://192.0.2.2:3128)
      enable_openai_api:
        name: Habilitar API OpenAI
        description: Habilitar endpoint de Chat Completions compatível com OpenAI. Permite usar o OpenClaw como agente de
          conversação no pipeline do HA Assist via Extended OpenAI Conversation (HACS) ou qualquer cliente compatível com
          OpenAI.
      auto_configure_mcp:
        name: Configurar MCP automaticamente para o Home Assistant
        description: Quando LIGADO e o token do Home Assistant estiver definido, registra automaticamente o Home Assistant
          como servidor MCP a cada inicialização. Isso permite que o OpenClaw controle entidades, serviços e automações do
          HA via Model Context Protocol. Desative apenas se você gerencia a configuração do mcporter manualmente.
  acpx_enabled:
    name: Infraestrutura ACPX
    description: Instalar launchers de wrapper ACPX (Claude Code, Codex, OpenCode) para que o OpenClaw execute agentes de código via
      backend ACPX local. Agentes de código configurados pelo usuário são preservados como estão. Interruptor mestre de
      toda a superfície acp(x) — DESLIGADO (padrão) = sem transferência de configuração de Writer/Binding, seus
      interruptores ficam inertes; LIGADO = liberação — os interruptores de Writer/Binding decidem então
      independentemente.
  harness_config_writer_enabled:
    name: Harness Config Writer
    description: Opcional (Repo-Split A2) - Implantar + registrar o plugin harness-config-writer incluído (gera a configuração nativa
      de arquivos/env dos harnesses a partir de config.harnesses). Interruptor independente de opt-in, DESLIGADO por
      padrão — não segue nem controla o ACP Dashboard Binding; só tem efeito com acpx_enabled ativado (mestre); é
      necessária uma harness_base_url para gerar qualquer coisa (vazio = no-op completo). Copia mas nunca sobrescreve —
      apenas entradas GERADAS anteriormente e idênticas byte a byte são atualizadas; edições manuais do operador e
      entradas sem a URL base configurada permanecem intactas. A primeira sessão ativada faz um snapshot dos arquivos
      gerenciados — desligar novamente restaura os originais automaticamente.
  harness:
    name: Harness (backends de código)
    description: Padrões compartilhados de provedor/modelo para os harnesses acpx incluídos (Claude Code, Codex, OpenCode) e o
      harness-config-writer. O endpoint é qualquer API compatível com OpenAI — não apenas Ollama. Sem uma harness_base_url
      configurada, todos os valores deste grupo ficam INERTES — apenas os interruptores valem (modelos, agentes e
      utility_model só têm efeito com a URL base definida).
    fields:
      harness_base_url:
        name: URL base do Harness
        description: Endpoint de backend para TODOS os harnesses locais (qualquer API compatível com OpenAI — não apenas Ollama),
          ex. http://198.51.100.20:11434. Também serve como ATIVADOR do harness-config-writer - vazio não gera nada (entradas
          do operador permanecem intactas). Sem valor vale o fallback interno http://localhost:11434.
      harness_api_key:
        name: Chave de API do Harness
        description: Chave de API usada por entradas de harness geradas (padrão compartilhado do writer). Vazio = sem chave
          (ex. Ollama local).
      harness_model:
        name: Modelo padrão (todos os harnesses)
        description: Modelo padrão compartilhado dos harnesses. Aplica-se a todos os harnesses NÃO excluídos (codex/opencode/claude
          mantêm seus modelos individuais abaixo), quando definido. Vazio = os padrões individuais vencem.
      utility_model:
        name: Modelo utility
        description: Opcional - Override para agents.defaults.utilityModel no openclaw.json (o modelo por trás dos callouts
          utility internos do gateway, em especial o observador de sessão). NÃO DEFINIDO = sem gravação (operator owns the
          value); defina apenas um modelo com saída strict-JSON limpa.
      harness_opencode_model:
        name: Modelo OpenCode (forge)
        description: Opcional - Modelo do harness OpenCode (forge). Padrão - glm-5.3-flash:cloud
      harness_claude_model:
        name: Modelo Claude Code
        description: Opcional - Modelo do harness Claude Code (também alimenta o fallback ANTHROPIC_MODEL ambient). Padrão
          - glm-5.3-flash:cloud
      harness_codex_model:
        name: Modelo Codex (audit)
        description: Opcional - Modelo do harness Codex (audit). Padrão - kimi-k2.7-code:cloud
      harness_excluded_agents:
        name: Harnesses excluídos
        description: Opcional - Lista de IDs de harness (separados por vírgula) EXCLUÍDOS dos padrões compartilhados acima
          (ex. "codex,opencode").
      additional_agents:
        name: Agentes adicionais
        description: Opcional - Lista de nomes ADICIONAIS de agentes/harnesses (separados por vírgula) para acp.allowedAgents
          além dos inclusos claude/codex/opencode/openclaw (ex. "pi,colibri,gemini"). Agentes personalizados também devem existir
          no roster do OpenClaw com runtime.type=acp; a lista é apenas unida, nunca sobrescrita.
      acp_dashboard_binding_enabled:
        name: ACP Dashboard Binding
        description: Opcional (Fase 2.15) - Implantar + registrar o plugin acp-dashboard-binding incluído (resolve conversas de
          dashboard/webchat em sessões de harness ACP). Interruptor independente de opt-in, DESLIGADO por padrão (v0.7.13.30)
          — não segue nem controla o Harness Config Writer; só tem efeito enquanto acpx_enabled=true (interruptor mestre);
          caso contrário, a transferência de configuração permanece desativada.
  gateway_ext:
    name: Gateway (external)
    description: URLs, trusted proxies and allowed origins for gateway access
    fields:
      gateway_public_url:
        name: URL Pública do Gateway
        description: URL base pública para abrir a interface web do Gateway em uma nova aba (não incorporada). Exemplo - https://exemplo.duckdns.org:12345
          ou http://192.0.2.10:18789
      gateway_remote_url:
        name: URL do Gateway Remoto
        description: URL WebSocket do gateway remoto usada quando Gateway Mode está em Remote (exemplo - ws://198.51.100.21:18789
          ou wss://gateway.example.com:443)
      gateway_trusted_proxies:
        name: Proxies Confiáveis do Gateway
        description: Lista de IPs/CIDR de proxies confiáveis separados por vírgula para o modo trusted-proxy (exemplo - 127.0.0.1,198.51.100.0/24).
      gateway_additional_allowed_origins:
        name: Origens permitidas adicionais
        description: Origens extras da Control UI separadas por vírgula, mescladas em gateway.controlUi.allowedOrigins no
          modo lan_https (exemplo - https://ha.example.com:8443,capacitor://localhost)
  logging_diag:
    name: Logging & diagnostics
    description: Console mirroring, log levels, startup trace, nginx, DNS and mDNS
    fields:
      gateway_log_to_console:
        name: Mostrar log do Gateway no log do HA
        description: Quando LIGADO, a saída do gateway (stdout/stderr) é espelhada na janela de log do app do Home Assistant
          além do arquivo de log. Útil para diagnóstico em tempo real. Quando DESLIGADO, os logs são gravados apenas no arquivo.
      gateway_log_level:
        name: Nível de log do Gateway
        description: Verbosidade do log do Gateway. 'off' mostra apenas erros, 'info' (padrão) mostra operação normal, 'debug'
          mostra detalhes para solução de problemas.
        options:
          false: Desligado (apenas erros)
          info: Info (padrão)
          debug: Debug (detalhado)
      trace_log_to_console:
        name: Mostrar rastreamento de inicialização no log do HA
        description: Quando LIGADO, o rastreamento detalhado da sequência de inicialização (saída set -x) é espelhado na janela
          de log do app do Home Assistant. Muito detalhado — ative apenas para depuração.
      gateway_startup_trace:
        name: Rastreamento de startup no log do app
        description: Opcional (diagnóstico, DESLIGADO por padrão) - Quando LIGADO, o log de boot recebe a divisão de tempos
          por fase/plugin ("startup trace - plugin ... ms"). Ferramenta para análise posterior de reinicializações lentas.
          Ligue, reinicie, leia o log, desligue novamente.
      nginx_log_level:
        name: Nível de log Nginx
        description: Detalhamento do log de acesso do nginx. 'minimal' (padrão) suprime requisições repetitivas de health-check
          e polling do HA. 'full' registra tudo.
        options:
          minimal: Mínimo (suprimir ruído de polling HA)
          full: Completo (registrar todas as requisições)
      force_ipv4_dns:
        name: Forçar ordem DNS IPv4
        description: Força prioridade IPv4 no DNS. A maioria das VMs HAOS não tem saída IPv6 — causa erros em web_fetch e
          Telegram. Recomendado LIGADO (padrão).
      mdns_mode:
        name: Modo mDNS
        description: Configuração mDNS/Bonjour para descoberta na LAN. 'off' desativa mDNS, 'minimal' anuncia o serviço gateway
          (padrão), 'full' anuncia com todos os metadados. O addon força o ativador nativo do OpenClaw (aqui em rede do host; num container Docker puro fica desativado silenciosamente) — a interface web na LAN continua em https://openclaw.local:18789.
        options:
          false: Desativado (sem mDNS)
          minimal: Mínimo (anunciar serviço gateway, padrão)
          full: Completo (anunciar com todos os metadados)
      mdns_host_name:
        name: Nome do host mDNS
        description: Nome de host opcional para anúncio mDNS (ex., homeassistant.local). O padrão é "openclaw". Se vazio,
          detectado automaticamente a partir do nome do host do contêiner.
  safety_nets:
    name: Safety nets
    description: Upgrade state backups and automatic gateway repair
    fields:
      abort_on_upgrade_backup_failure:
        name: Abortar se falhar o backup pré-atualização
        description: 'Quando LIGADO (recomendado), o app não iniciará uma nova versão do OpenClaw se o backup de estado pré-atualização
          falhar (ex.: disco cheio). Desligue apenas em emergências; retornar à versão anterior pode ficar impossível.'
      upgrade_backup_keep:
        name: Backups de atualização a manter
        description: Quantos arquivos de backup pré-atualização são mantidos antes do mais antigo ser removido (padrão 3).
      gateway_doctor_repair_max:
        name: Execuções de reparo doctor por início
        description: Máximo de execuções automáticas de `openclaw doctor --fix` por início do app após 2 falhas consecutivas
          do gateway. 0 desativa o reparo automático.
  runtime:
    name: Runtime
    description: Apt packages, custom init script and SSRP hostname blocklist
    fields:
      runtime_apt_packages:
        name: Pacotes APT em tempo de execução
        description: Opcional - Lista de pacotes APT separados por espaços para instalar na inicialização do contêiner. Os
          pacotes são reinstalados a cada reinício (não persistentes na imagem). Exemplo - ffmpeg postgresql-client
      custom_init_script:
        name: Script de init personalizado
        description: Opcional - Caminho para um script executável que roda antes do OpenClaw. Deve ser idempotente. Monte
          via /config/ ou /share/. Exemplo - /share/scripts/my-init.sh
      blocked_hostnames:
        name: Nomes de host bloqueados
        description: Lista separada por vírgulas de nomes de host bloqueados para acesso de rede de saída. Deixe vazio para
          permitir todos. Exemplo - router.lan,192.0.2.1
  legacy:
    name: Legacy
    description: Retired options kept for compatibility
    fields:
      controlui_disable_device_auth:
        name: Obsoleta — sem efeito (o pareamento sempre é pelo fluxo de dispositivo)
        description: Opção obsoleta (mantida por compatibilidade). Desde o OpenClaw 2026.9.8, a flag gateway.controlUi.dangerouslyDisableDeviceAuth
          foi aposentada e é ignorada pelo upstream, e o app não a grava mais na configuração do gateway. Navegadores do Control-UI
          sempre pareiam pelo fluxo de dispositivo normal em qualquer modo de rede; nenhuma etapa manual no terminal é necessária.
