configuration:
  timezone:
    name: Zeitzone
    description: Zeitzone für die App (z.B. Europe/Berlin, America/New_York)
  network_mode:
    name: Netzwerkmodus
    description: Legt gateway.bind, gateway.auth.mode, gateway.tls und gateway.tailscale.mode in einem Schritt fest.
    options:
      ingress_only: Nur Ingress (Loopback + Token, nur HA Ingress)
      lan_http: LAN HTTP (ohne TLS auf gateway_port)
      lan_https: LAN HTTPS (OpenClaw-TLS auf gateway_port, empfohlen für Smartphones)
      tailnet_serve: Tailscale Serve (sichere Tailnet-HTTPS-URL)
      tailnet_funnel: Tailscale Funnel (öffentlich erreichbar via Tailscale)
      reverse_proxy: Reverse Proxy (Loopback + Trusted-Proxy für externen Proxy)
  gateway_port:
    name: Gateway-Port
    description: Portnummer, auf der das OpenClaw-Gateway lauscht (Standard - 18789). Im LAN- und Tailscale-Modus ist das
      der extern erreichbare Port.
  gateway_env_vars:
    name: Gateway-Umgebungsvariablen
    description: Umgebungsvariablen, die beim Start an den OpenClaw-Gateway-Prozess übergeben werden (Liste mit name/value-Einträgen
      in der Home Assistant UI; max. 50 Variablen, Schlüssel bis 255 Zeichen, Werte bis 10.000 Zeichen).
  gateway_mode:
    name: Gateway-Modus
    description: Gateway-Betriebsmodus - local (Gateway lokal ausführen, empfohlen) oder remote (mit einem entfernten Gateway
      verbinden)
    options:
      local: Lokal (empfohlen)
      remote: Remote
  terminal_port:
    name: Terminal-Port
    description: Externer Port des Web-Terminals (Standard - 7681). Das Terminal selbst ist immer aktiv — es erscheint über
      den Ingress und ist die Wartungs-/Reparatur-Fläche (Operator-CLI-Rettungsanker); konfigurierbar ist nur sein Port.
      Ändern, wenn dieser Port mit einem anderen Dienst kollidiert.
  enable_webui:
    name: WebUI aktivieren
    description: WebUI-Tab in der Ingress-UI anzeigen (OpenClaw Control Dashboard).
  enable_docs:
    name: Docs aktivieren
    description: Docs-Tab in der Ingress-UI anzeigen (statische Dokumentation + Live-Status).
  ha_integration:
    name: Home-Assistant-Integration
    description: HA-Token, MCP, OpenAI-API-Endpoint und Proxy
    fields:
      homeassistant_token:
        name: Home Assistant Token
        description: Optional - Langlebiger Home Assistant Token für lokale API-Skripte/Tools
      http_proxy:
        name: Ausgehender HTTP-Proxy
        description: Optional - Proxy-URL für ausgehende HTTP/HTTPS-Anfragen (Beispiel - http://192.0.2.2:3128)
      enable_openai_api:
        name: OpenAI-kompatible API aktivieren
        description: OpenAI-kompatiblen Chat-Completions-Endpunkt freigeben (für die HA-Assist-Pipeline).
      auto_configure_mcp:
        name: MCP für Home Assistant automatisch konfigurieren
        description: Wenn AN und Home Assistant Token gesetzt ist, wird Home Assistant bei jedem Start automatisch als MCP-Server
          registriert. Das erlaubt OpenClaw, HA-Geräte, -Dienste und -Automatisierungen über das Model Context Protocol zu
          steuern. Nur deaktivieren, wenn die mcporter-Konfiguration manuell verwaltet wird.
  acpx_enabled:
    name: ACPX-Harness-Infrastruktur
    description: ACPX-Wrapper-Launcher (Claude Code, Codex, OpenCode) installieren, damit OpenClaw Coding-Agenten über das lokale
      ACPX-Backend ausführen kann. Bestehende, eigenständig konfigurierte Coding-Agenten bleiben unverändert.
      Master-Schalter der gesamt acp(x)-Fläche — AUS (Standard) = keine Config-Übertragung für Writer/Binding, deren
      Schalter bleiben wirkungslos; AN = Freigabe, dann entscheiden die Writer-/Binding-Schalter eigenständig.
  harness_config_writer_enabled:
    name: Harness Config Writer
    description: Optional (Repo-Split A2) - Das gebündelte harness-config-writer-Plugin deployt + registrieren (erzeugt aus
      config.harnesses die harness-nativen Datei/Env-Konfigurationen). Unabhängiger Opt-in-Schalter, Standard AUS — folgt
      dem ACP-Dashboard-Binding weder noch treibt es an; nur wirksam bei aktiviertem acpx_enabled (Master); zur
      tatsächlichen Generierung ist eine harness_base_url nötig (leer = kompletter No-op). Kopiert, überschreibt nie — nur
      byte-identische, zuvor GENERIERTE Einträge werden aktualisiert; Operator-Hand-edits und Einträge ohne die
      konfigurierte Base URL bleiben unangetastet. Die erste aktivierte Session snapshotet die verwalteten Harness-Dateien
      - Rückumschaltung stellt die Originale automatisch wieder her.
  harness:
    name: Harness (Coding-Backends)
    description: Geteilte Provider-/Modell-Defaults für die gebündelten ACPX-Harnesses (Claude Code, Codex, OpenCode) und den
      harness-config-writer. Der Endpunkt ist jede OpenAI-kompatible API — nicht nur Ollama. Ohne gesetzte
      harness_base_url sind alle Werte dieser Gruppe INERT — nur die Schalter gelten (Modelle, Agents und utility_model
      werden erst mit Base URL übernommen).
    fields:
      harness_base_url:
        name: Harness-Basis-URL
        description: Backend-Endpunkt für ALLE lokal betriebenen Harnesses (jede OpenAI-kompatible API — nicht nur Ollama),
          z.B. http://198.51.100.20:11434. Ist zugleich der AKTIVATOR für den harness-config-writer - leer erzeugt nichts
          (bestehende Operator-Einträge bleiben unangetastet). Ohne Wert fällt die eingebaute Fallback-URL http://localhost:11434
          zurück.
      harness_api_key:
        name: Harness-API-Key
        description: API-Key, der von generierten Harness-Einträgen verwendet wird (geteilter Writer-Standard). Leer = ohne
          Key (z.B. lokale Ollama).
      harness_model:
        name: Standard-Modell (alle Harnesses)
        description: Geteiltes Harness-Standard-Modell. Gilt für alle NICHT ausgeschlossenen Harnesses (codex/opencode/claude
          behalten unten ihre Einzel-Modelle), sofern gesetzt. Leer = Einzel-Defaults gewinnen.
      utility_model:
        name: Utility-Modell
        description: Optional - Override für agents.defaults.utilityModel in openclaw.json (Modell hinter internen Gateway-Utility-Callouts,
          u.a. der Session-Observer). UNSET = kein Write (Operator owns the value); nur setzen mit einem Modell mit sauberem
          strict-JSON-Output.
      harness_opencode_model:
        name: OpenCode (forge) Modell
        description: Optional - Modell des OpenCode-Harness (forge). Standard - glm-5.3-flash:cloud
      harness_claude_model:
        name: Claude Code Modell
        description: Optional - Modell des Claude-Code-Harness (speist auch den ambienten ANTHROPIC_MODEL-Fallback). Standard
          - glm-5.3-flash:cloud
      harness_codex_model:
        name: Codex (audit) Modell
        description: Optional - Modell des Codex-Harness (audit). Standard - kimi-k2.7-code:cloud
      harness_excluded_agents:
        name: Ausgeschlossene Harnesses
        description: Optional - Kommagetrennte Harness-IDs, die von den obigen geteilten Defaults AUSGESCHLOSSEN werden (z.B.
          "codex,opencode").
      additional_agents:
        name: Additional Agents
        description: Optional - Kommagetrennte ZUSÄTZLICHE Agent-/Harness-Namen für acp.allowedAgents neben den gebündelten
          claude/codex/opencode/openclaw (z.B. "pi,colibri,gemini"). Custom-Agenten müssen zusätzlich im OpenClaw-Agent-Roster
          mit runtime.type=acp existieren; die Liste wird nur ergänzt, nie überschrieben.
      acp_dashboard_binding_enabled:
        name: ACP-Dashboard-Binding
        description: Optional (Phase 2.15) - Das gebündelte acp-dashboard-binding-Plugin deployen + registrieren (löst
          Dashboard-/Webchat-Konversationen auf ACP-Harness-Sessions auf). Unabhängiger Opt-in-Schalter, Standard AUS
          (v0.7.13.30) — folgt dem Harness-Config-Writer weder noch treibt ihn an; gilt nur, solange acpx_enabled=true ist
          (Master-Schalter); sonst bleibt die Config-Übertragung aus.
  gateway_ext:
    name: Gateway extern
    description: URLs, Trusted Proxies und zulaessige Origins fuer den Gateway-Zugriff
    fields:
      gateway_public_url:
        name: Öffentliche Gateway-URL
        description: 'Optional: URL für den ''WebUI ↗''-Button im Ingress-Titelbar. Beispiel - https://openclaw.local:18789
          oder https://mein-gerät.tailnet.ts.net.'
      gateway_remote_url:
        name: Remote Gateway-URL
        description: Remote-Gateway-WebSocket-URL, verwendet wenn Gateway-Modus auf Remote steht (Beispiel - ws://198.51.100.21:18789
          oder wss://gateway.example.com:443)
      gateway_trusted_proxies:
        name: Vertrauenswürdige Gateway-Proxys
        description: Komma-getrennte Liste vertrauenswürdiger Proxy-IPs/CIDRs, nur im Netzwerkmodus "Reverse Proxy" (Beispiel
          - 127.0.0.1,198.51.100.0/24).
      gateway_additional_allowed_origins:
        name: Zusätzliche erlaubte Origins
        description: Kommagetrennte zusätzliche Control-UI-Origins, die bei lan_https in gateway.controlUi.allowedOrigins
          zusammengeführt werden (Beispiel - https://ha.example.com:8443,capacitor://localhost)
  logging_diag:
    name: Logging & Diagnose
    description: Konsolen-Logausgabe, Loglevel, Startup-Trace, nginx, DNS und mDNS
    fields:
      gateway_log_to_console:
        name: Gateway-Log in HA-Log anzeigen
        description: Wenn EIN, wird die Gateway-Ausgabe (stdout/stderr) zusätzlich zur Log-Datei auch im Home Assistant App-Log-Fenster
          angezeigt. Nützlich für Echtzeit-Diagnose. Bei AUS werden Logs nur in die Datei geschrieben.
      gateway_log_level:
        name: Gateway-Log-Level
        description: Gateway-Log-Ausführlichkeit. 'off' zeigt nur Fehler, 'info' (Standard) zeigt normalen Betrieb, 'debug'
          zeigt ausführliche Details zur Fehlerbehebung.
        options:
          false: Aus (nur Fehler)
          info: Info (Standard)
          debug: Debug (ausführlich)
      trace_log_to_console:
        name: Boot-Trace in HA-Log anzeigen
        description: Wenn EIN, wird die detaillierte Boot-Sequenz (set -x Trace) zusätzlich zur Log-Datei auch im Home Assistant
          App-Log-Fenster angezeigt. Sehr ausführlich — nur für Fehleranalyse aktivieren.
      gateway_startup_trace:
        name: Startup-Trace im App-Log
        description: Optional (diagnostisch, Standard AUS) - Wenn AN, enthält das Boot-Log eine Phasen-/Plugin-Zeitauflösung
          ("startup trace - plugin ... ms"). Werkzeug zur Analyse nachträglich langsamer Starts. Einschalten, neu starten,
          App-Log lesen, wieder ausschalten.
      nginx_log_level:
        name: Nginx-Access-Log-Stufe
        description: full oder minimal - minimal unterdrückt Health-Check-Polling-Rauschen.
      force_ipv4_dns:
        name: IPv4-DNS erzwingen
        description: IPv4 für DNS-Auflösung bevorzugen (die meisten HAOS-Systeme haben keinen IPv6-Egress).
      mdns_mode:
        name: mDNS-Modus
        description: mDNS/Bonjour-Konfiguration für LAN-Erkennung via OpenClaws eingebautem bonjour-Plugin. 'off' deaktiviert
          mDNS, 'minimal' bewirbt den Gateway-Dienst (Standard), 'full' bewirbt mit allen Metadaten. Das Add-on erzwingt den nativen OpenClaw-Advertiser (das Add-on laeuft im Host-Netz; in einem reinen Docker-Container waere er still deaktiviert) — die LAN-Weboberflaeche bleibt unter https://openclaw.local:18789 erreichbar.
        options:
          false: Aus (kein mDNS)
          minimal: Minimal (Gateway-Dienst bewerben, Standard)
          full: Vollständig (alle Metadaten bewerben)
      mdns_host_name:
        name: mDNS-Hostname
        description: Hostname für mDNS-Advertisements (ohne .local; Standard - openclaw). Wird in OPENCLAW_MDNS_HOSTNAME gesetzt
          und als Container-Hostname verwendet, damit das TLS-Zertifikat den Namen enthält.
  safety_nets:
    name: Vorsorge & Selbstheilung
    description: Upgrade-Backups und automatische Gateway-Reparaturen
    fields:
      abort_on_upgrade_backup_failure:
        name: Abbruch bei fehlgeschlagenem Upgrade-Backup
        description: Wenn EIN (empfohlen), startet die App eine neue OpenClaw-Version nicht, wenn das Vorab-Backup fehlschlägt
          (z. B. volle Disk). Nur im Notfall AUS schalten; ein Rollback zur Vorgängerversion ist dann evtl. unmöglich.
      upgrade_backup_keep:
        name: Zu behaltende Upgrade-Backups
        description: Anzahl der aufbewahrten Vorab-Backup-Archive, bevor das älteste gelöscht wird (Standard 3).
      gateway_doctor_repair_max:
        name: Doctor-Reparaturen pro Start
        description: Maximale automatische `openclaw doctor --fix`-Läufe pro App-Start nach 2 aufeinanderfolgenden fehlgeschlagenen
          Gateway-Starts. 0 deaktiviert die automatische Reparatur.
  runtime:
    name: Laufzeit
    description: Apt-Pakete, eigenes Init-Skript und SSRP-Hostname-Blockliste
    fields:
      runtime_apt_packages:
        name: Laufzeit-APT-Pakete
        description: Optional - Leerzeichengetrennte Liste von APT-Paketen, die bei jedem Container-Start installiert werden.
          Pakete werden bei Neustarts neu installiert (nicht im Image persistent). Beispiel - ffmpeg postgresql-client
      custom_init_script:
        name: Benutzerdefiniertes Init-Skript
        description: Optional - Pfad zu einem ausführbaren Skript, das vor dem OpenClaw-Start ausgeführt wird. Muss idempotent
          sein. Über /config/ oder /share/ einbinden. Beispiel - /share/scripts/my-init.sh
      blocked_hostnames:
        name: Blockierte Hostnamen
        description: Kommagetrennte Liste von Hostnamen, die für ausgehende Netzwerkzugriffe blockiert sind. Leer lassen,
          um alle zu erlauben. Beispiel - router.lan,192.0.2.1
  legacy:
    name: Legacy
    description: Nicht mehr genutzte oder ersetzte Optionen
    fields:
      controlui_disable_device_auth:
        name: Veraltet — ohne Wirkung (Kopplung immer über Geräte-Flow)
        description: Veraltete Option (aus Kompatibilitätsgründen beibehalten). Seit OpenClaw 2026.9.8 ist gateway.controlUi.dangerouslyDisableDeviceAuth
          upstream entfernt und wirkungslos; die App schreibt den Schlüssel nicht mehr in die Gateway-Konfiguration. Control-UI-Browser
          koppeln in jedem Netzwerkmodus immer über den normalen Geräte-Flow; keine manuellen Terminal-Schritte nötig.
