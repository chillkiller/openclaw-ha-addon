configuration:
  timezone:
    name: Strefa czasowa
    description: Strefa czasowa dla dodatku (np. Europe/Warsaw, America/New_York)
  network_mode:
    name: Tryb sieci
    description: Jedno źródło prawdy dla gateway.bind/auth/tls/tailscale. ingress_only - tylko HA Ingress i terminal; lan_http
      - HTTP w LAN bez TLS; lan_https - HTTPS w LAN z automatycznym TLS; tailnet_serve/tailnet_funnel - HTTPS przez Tailscale;
      reverse_proxy - zewnętrzny reverse proxy.
  gateway_port:
    name: Port Gateway
    description: Numer portu na którym gateway OpenClaw będzie nasłuchiwał (domyślnie - 18789). W trybach LAN i Tailscale
      port ten jest osiągalny z zewnątrz.
  gateway_env_vars:
    name: Zmienne środowiskowe gateway
    description: Zmienne środowiskowe przekazywane do procesu gateway OpenClaw podczas uruchamiania (lista wpisów name/value
      w UI Home Assistant; maks. 50 zmiennych, klucze do 255 znaków, wartości do 10000 znaków).
  gateway_mode:
    name: Tryb Gateway
    description: Tryb działania gateway - local (uruchom gateway lokalnie, zalecane) lub remote (połącz się ze zdalnym gateway)
    options:
      local: Lokalny (zalecane)
      remote: Zdalny
  terminal_port:
    name: Port terminala
    description: Zewnętrzny port terminala webowego (domyślnie - 7681). Sam terminal jest zawsze włączony — widoczny przez
      Ingress i stanowi powierzchnię konserwacji/naprawy (furtka operatora CLI); konfigurowalny jest tylko jego port. Zmień,
      jeśli ten port koliduje z inną usługą.
  enable_webui:
    name: Włącz WebUI
    description: Pokazuj zakładkę WebUI w interfejsie Ingress (Panel sterowania OpenClaw).
  enable_docs:
    name: Włącz Docs
    description: Pokazuj zakładkę Docs w interfejsie Ingress (dokumentacja statyczna i status na żywo).
  ha_integration:
    name: Home Assistant integration
    description: HA token, MCP, OpenAI API endpoint and proxy
    fields:
      homeassistant_token:
        name: Token Home Assistant
        description: Opcjonalnie - długoterminowy token Home Assistant dla lokalnych skryptów/narzędzi API HA
      http_proxy:
        name: Wychodzący proxy HTTP
        description: Opcjonalnie - URL proxy dla wychodzących żądań HTTP/HTTPS (przykład - http://192.168.2.1:3128)
      enable_openai_api:
        name: Włącz API OpenAI
        description: Włącz endpoint Chat Completions kompatybilny z OpenAI. Pozwala używać OpenClaw jako agenta konwersacji
          w HA Assist pipeline przez Extended OpenAI Conversation (HACS) lub dowolnego klienta kompatybilnego z OpenAI.
      auto_configure_mcp:
        name: Automatyczna konfiguracja MCP dla Home Assistant
        description: Gdy WŁĄCZONE i token Home Assistant jest ustawiony, automatycznie rejestruje Home Assistant jako serwer
          MCP przy każdym starcie. Pozwala to OpenClaw kontrolować urządzenia HA, usługi i automatyzacje przez Model Context
          Protocol. Wyłącz tylko jeśli zarządzasz konfiguracją mcporter ręcznie.
  acpx_enabled:
    name: Infrastruktura ACPX
    description: Instaluj launchery wrapperów ACPX (Claude Code, Codex, OpenCode), aby OpenClaw mógł uruchamiać agentów kodujących
      przez lokalny backend ACPX. Istniejąca konfiguracja agentów użytkownika pozostaje bez zmian.
  harness_config_writer_enabled:
    name: Harness Config Writer
    description: Opcjonalnie (Repo-Split A2) - Wdróż + zarejestruj wbudowany plugin harness-config-writer (generuje natywną
      konfigurację plik/env harnessów z config.harnesses). NIEUSTAWIONE (puste) podąża za przełącznikiem ACP Dashboard Binding;
      WŁĄCZONE wymusza działanie nawet przy wyłączonym bindingu; WYŁĄCZONE trzyma go trwale wyłączonego. Pierwsza włączona
      sesja robi zrzut zarządzanych plików harnessów — ponowne wyłączenie automatycznie przywraca oryginały.
  harness:
    name: Harness (backendy kodujące)
    description: Wspólne domyślne provider/ustawienia modeli dla wbudowanych harnessów acpx (Claude Code, Codex, OpenCode)
      i harness-config-writer. Endpointem jest dowolne API kompatybilne z OpenAI — nie tylko Ollama.
    fields:
      harness_base_url:
        name: Bazowy URL Harness
        description: Endpoint backendu dla WSZYSTKICH lokalnych harnessów (dowolne API kompatybilne z OpenAI — nie tylko Ollama),
          np. http://192.168.178.34:11434. Pełni też rolę AKTYWATORA harness-config-writer - puste niczego nie generuje (wpisy
          operatora pozostają nietknięte). Bez wartości obowiązuje wbudowany fallback http://localhost:11434.
      harness_api_key:
        name: Klucz API Harness
        description: Klucz API używany przez wygenerowane wpisy harnessów (wspólny domyślny writer). Puste = bez klucza (np.
          lokalna Ollama).
      harness_model:
        name: Model domyślny (wszystkie harnessy)
        description: Wspólny domyślny model harness. Stosowany do wszystkich NIEwykluczonych harnessów (codex/opencode/claude
          zachowują swoje indywidualne modele poniżej), gdy ustawiony. Puste = wygrywają domyślne wartości indywidualne.
      utility_model:
        name: Model utility
        description: Opcjonalnie - Override dla agents.defaults.utilityModel w openclaw.json (model za wewnętrznymi wywołaniami
          utility gateway, zwłaszcza obserwatorem sesji). NIEUSTAWIONE = bez zapisu (operator owns the value); ustawiaj tylko
          model z czystym wyjściem strict-JSON.
      harness_opencode_model:
        name: Model OpenCode (forge)
        description: Opcjonalnie - Model harnessa OpenCode (forge). Domyślnie - glm-5.3-flash:cloud
      harness_claude_model:
        name: Model Claude Code
        description: Opcjonalnie - Model harnessa Claude Code (zasila także ambient ANTHROPIC_MODEL fallback). Domyślnie
          - glm-5.3-flash:cloud
      harness_codex_model:
        name: Model Codex (audit)
        description: Opcjonalnie - Model harnessa Codex (audit). Domyślnie - kimi-k2.7-code:cloud
      harness_excluded_agents:
        name: Wykluczone harnessy
        description: Opcjonalnie - Lista ID harnessów (rozdzielona przecinkami) WYKLUCZONYCH ze wspólnych domyślnych powyżej
          (np. "codex,opencode").
      additional_agents:
        name: Dodatkowe agenty
        description: Opcjonalnie - Lista DODATKOWYCH nazw agentów/harnessów (rozdzielona przecinkami) dla acp.allowedAgents
          obok wbudowanych claude/codex/opencode/openclaw (np. "pi,colibri,gemini"). Agenty niestandardowe muszą też istnieć
          w rosterze OpenClaw z runtime.type=acp; lista jest tylko uzupełniana, nigdy nadpisywana.
      acp_dashboard_binding_enabled:
        name: ACP Dashboard Binding
        description: Opcjonalnie (Faza 2.15) - Wdróż + zarejestruj wbudowany plugin acp-dashboard-binding (przypisuje rozmowy
          dashboard/webchat do sesji harness ACP). WŁĄCZONE domyślnie — binding to główna powierzchnia dodatku; WYŁĄCZONE
          dla realnego opt-out operatora.
  gateway_ext:
    name: Gateway (external)
    description: URLs, trusted proxies and allowed origins for gateway access
    fields:
      gateway_public_url:
        name: Publiczny URL Gateway
        description: Publiczny bazowy URL do otwierania Web UI Gateway w nowej karcie (nie osadzone). Przykład - https://przyklad.duckdns.org:12345
          lub http://192.168.1.10:18789
      gateway_remote_url:
        name: URL zdalnego Gateway
        description: Adres WebSocket zdalnego gateway używany gdy Gateway Mode = Remote (przykład - ws://192.168.1.20:18789
          lub wss://gateway.example.com:443)
      gateway_trusted_proxies:
        name: Zaufane proxy Gateway
        description: Lista zaufanych IP/CIDR proxy rozdzielona przecinkami dla trybu trusted-proxy (przykład - 127.0.0.1,192.168.88.0/24).
      gateway_additional_allowed_origins:
        name: Dodatkowe dozwolone origins
        description: Dodatkowe origins Control UI rozdzielone przecinkami; łączone z gateway.controlUi.allowedOrigins w trybie
          lan_https (przykład - https://ha.example.com:8443,capacitor://localhost)
  logging_diag:
    name: Logging & diagnostics
    description: Console mirroring, log levels, startup trace, nginx, DNS and mDNS
    fields:
      gateway_log_to_console:
        name: Pokazuj log Gateway w logu HA
        description: Gdy WŁĄCZONE, wyjście gateway (stdout/stderr) jest duplikowane w oknie logu dodatku Home Assistant oprócz
          pliku log. Przydatne do diagnostyki w czasie rzeczywistym. Gdy WYŁĄCZONE, logi zapisywane są tylko do pliku.
      gateway_log_level:
        name: Poziom logu Gateway
        description: Szczegółowość logu Gateway. 'off' pokazuje tylko błędy, 'info' (domyślne) pokazuje normalną operację,
          'debug' pokazuje szczegóły do rozwiązywania problemów.
        options:
          false: Wyłączone (tylko błędy)
          info: Info (domyślne)
          debug: Debug (szczegółowe)
      trace_log_to_console:
        name: Pokazuj śledzenie startu w logu HA
        description: Gdy WŁĄCZONE, szczegółowe śledzenie sekwencji startowej (wyjście set -x) jest duplikowane w oknie logu
          dodatku Home Assistant. Bardzo szczegółowe — włącz tylko do debugowania.
      gateway_startup_trace:
        name: Śledzenie startupu w logu dodatku
        description: Opcjonalnie (diagnostyczne, domyślnie WYŁĄCZONE) - Gdy WŁĄCZONE, log startu otrzymuje rozbicie czasów
          per faza/per plugin ("startup trace - plugin ... ms"). Narzędzie do analizy opóźnionych restartów po fakcie. Włącz,
          zrestartuj, przeczytaj log, wyłącz ponownie.
      nginx_log_level:
        name: Poziom logów Nginx
        description: Szczegółowość logów dostępu nginx. 'minimal' (domyślnie) pomija powtarzające się żądania health-check
          i polling HA. 'full' loguje wszystko.
        options:
          minimal: Minimalny (pominięcie szumu polling HA)
          full: Pełny (logowanie wszystkich żądań)
      force_ipv4_dns:
        name: Wymuś kolejność DNS IPv4
        description: Wymusza priorytet IPv4 w DNS. Większość VM HAOS nie ma wyjścia IPv6 — powoduje błędy web_fetch i Telegram.
          Zalecane WŁĄCZONE (domyślnie).
      mdns_mode:
        name: Tryb mDNS
        description: Konfiguracja mDNS/Bonjour dla odkrywania w LAN. 'off' wyłącza mDNS, 'minimal' ogłasza usługę gateway
          (domyślnie), 'full' ogłasza ze wszystkimi metadanymi.
        options:
          false: Wyłączony (bez mDNS)
          minimal: Minimalny (ogłaszanie usługi gateway, domyślnie)
          full: Pełny (ogłaszanie ze wszystkimi metadanymi)
      mdns_host_name:
        name: Nazwa hosta mDNS
        description: Opcjonalna nazwa hosta dla reklamy mDNS (np. homeassistant.local). Wartość domyślna to "openclaw". Jeśli
          puste, wykrywana automatycznie z nazwy hosta kontenera.
  safety_nets:
    name: Safety nets
    description: Upgrade state backups and automatic gateway repair
    fields:
      abort_on_upgrade_backup_failure:
        name: Przerwij przy nieudanej kopii przed aktualizacją
        description: Gdy WŁĄCZONE (zalecane), aplikacja nie uruchomi nowej wersji OpenClaw, jeśli kopia zapasowa przed aktualizacją
          się nie powiedzie (np. pełny dysk). Wyłączaj tylko w nagłych przypadkach; powrót do poprzedniej wersji może być
          wtedy niemożliwy.
      upgrade_backup_keep:
        name: Liczba zachowanych kopii przed aktualizacją
        description: Ile kopii zapasowych przed aktualizacją jest przechowywanych, zanim najstarsza zostanie usunięta (domyślnie
          3).
      gateway_doctor_repair_max:
        name: Naprawy doctor na start
        description: Maksymalna liczba automatycznych uruchomień `openclaw doctor --fix` na start aplikacji po 2 kolejnych
          nieudanych startach gatewaya. 0 wyłącza automatyczną naprawę.
  runtime:
    name: Runtime
    description: Apt packages, custom init script and SSRP hostname blocklist
    fields:
      runtime_apt_packages:
        name: Pakiety APT w trakcie działania
        description: Opcjonalnie - Lista pakietów APT oddzielonych spacjami do instalacji przy starcie kontenera. Pakiety
          są ponownie instalowane przy każdym restarcie (nie trwałe w obrazie). Przykład - ffmpeg postgresql-client
      custom_init_script:
        name: Niestandardowy skrypt init
        description: Opcjonalnie - Ścieżka do wykonywalnego skryptu uruchamianego przed OpenClaw. Musi być idempotentny. Zamontuj
          przez /config/ lub /share/. Przykład - /share/scripts/my-init.sh
      blocked_hostnames:
        name: Zablokowane nazwy hostów
        description: Lista oddzielona przecinkami zablokowanych nazw hostów dla wychodzącego dostępu sieciowego. Pozostaw
          puste, aby zezwolić na wszystkie. Przykład - router.lan,192.168.178.1
  legacy:
    name: Legacy
    description: Retired options kept for compatibility
    fields:
      controlui_disable_device_auth:
        name: Przestarzała — bez efektu (parowanie zawsze przez przepływ urządzeń)
        description: Opcja przestarzała (zachowana dla kompatybilności). Od OpenClaw 2026.9.8 flaga gateway.controlUi.dangerouslyDisableDeviceAuth
          została wycofana i jest ignorowana przez upstream, a aplikacja nie zapisuje jej już w konfiguracji gatewaya. Przeglądarki
          Control-UI zawsze łączą się poprzez normalny przepływ parowania urządzeń w każdym trybie sieciowym; nie są wymagane
          żadne ręczne kroki w terminalu.