configuration:
  timezone:
    name: Strefa czasowa
    description: Strefa czasowa dla dodatku (np. Europe/Warsaw, America/New_York)
  
  enable_terminal:
    name: Włącz terminal webowy
    description: Włącz przycisk terminala webowego w Home Assistant (Ingress) przez ttyd
  
  terminal_port:
    name: Port terminala
    description: Numer portu dla terminala webowego (domyślnie - 7681). Zmień jeśli ten port koliduje z inną usługą.
  
  gateway_public_url:
    name: Publiczny URL Gateway
    description: Publiczny bazowy URL do otwierania Web UI Gateway w nowej karcie (nie osadzone). Przykład - https://przyklad.duckdns.org:12345 lub http://192.168.1.10:18789
  
  homeassistant_token:
    name: Token Home Assistant
    description: Opcjonalnie - długoterminowy token Home Assistant dla lokalnych skryptów/narzędzi API HA

  http_proxy:
    name: Wychodzący proxy HTTP
    description: Opcjonalnie - URL proxy dla wychodzących żądań HTTP/HTTPS (przykład - http://192.168.2.1:3128)
  
  router_ssh_host:
    name: Host SSH routera
    description: Opcjonalnie - nazwa hosta SSH routera/firewalla lub adres IP
  
  router_ssh_user:
    name: Użytkownik SSH routera
    description: Opcjonalnie - nazwa użytkownika SSH routera/firewalla
  
  router_ssh_key_path:
    name: Ścieżka klucza SSH routera
    description: Ścieżka do klucza prywatnego SSH dla dostępu do routera (domyślnie - /data/keys/router_ssh)
  
  clean_session_locks_on_start:
    name: Wyczyść blokady sesji przy starcie
    description: Usuń przestarzałe pliki blokad sesji pozostawione po awariach/restartach gdy dodatek się uruchamia
  
  clean_session_locks_on_exit:
    name: Wyczyść blokady sesji przy wyjściu
    description: Usuń pliki blokad sesji gdy dodatek zatrzymuje się poprawnie
  
  gateway_mode:
    name: Tryb Gateway
    description: Tryb działania gateway - local (uruchom gateway lokalnie, zalecane) lub remote (połącz się ze zdalnym gateway)
    options:
      local: "Lokalny (zalecane)"
      remote: "Zdalny"

  gateway_remote_url:
    name: URL zdalnego Gateway
    description: Adres WebSocket zdalnego gateway używany gdy Gateway Mode = Remote (przykład - ws://192.168.1.20:18789 lub wss://gateway.example.com:443)

  gateway_additional_allowed_origins:
    name: Dodatkowe dozwolone origins
    description: Dodatkowe origins Control UI rozdzielone przecinkami; łączone z gateway.controlUi.allowedOrigins w trybie lan_https (przykład - https://ha.example.com:8443,capacitor://localhost)

  controlui_disable_device_auth:
    name: Wyłącz parowanie urządzeń Control UI (lan_https)
    description: "Gdy WŁĄCZONE (zalecane), ustawia gateway.controlUi.dangerouslyDisableDeviceAuth=true, pomija akceptację per-urządzenie i zapobiega błędowi 1008 w trybie LAN HTTPS. Zostaw WŁĄCZONE w domowej/zaufanej sieci. Wyłącz tylko jeśli chcesz ścisłe parowanie dla każdej nowej przeglądarki/urządzenia."

  gateway_port:
    name: Port Gateway
    description: Numer portu na którym gateway OpenClaw będzie nasłuchiwał (domyślnie - 18789)

  gateway_trusted_proxies:
    name: Zaufane proxy Gateway
    description: Lista zaufanych IP/CIDR proxy rozdzielona przecinkami dla trybu trusted-proxy (przykład - 127.0.0.1,192.168.88.0/24).

  enable_openai_api:
    name: Włącz API OpenAI
    description: Włącz endpoint Chat Completions kompatybilny z OpenAI. Pozwala używać OpenClaw jako agenta konwersacji w HA Assist pipeline przez Extended OpenAI Conversation (HACS) lub dowolnego klienta kompatybilnego z OpenAI.

  force_ipv4_dns:
    name: Wymuś kolejność DNS IPv4
    description: Wymusza priorytet IPv4 w DNS. Większość VM HAOS nie ma wyjścia IPv6 — powoduje błędy web_fetch i Telegram. Zalecane WŁĄCZONE (domyślnie).

  nginx_log_level:
    name: Poziom logów Nginx
    description: "Szczegółowość logów dostępu nginx. 'minimal' (domyślnie) pomija powtarzające się żądania health-check i polling HA. 'full' loguje wszystko."
    options:
      minimal: "Minimalny (pominięcie szumu polling HA)"
      full: "Pełny (logowanie wszystkich żądań)"

  mdns_mode:
    name: Tryb mDNS
    description: "Konfiguracja mDNS/Bonjour dla odkrywania w LAN. 'off' wyłącza mDNS, 'minimal' ogłasza usługę gateway (domyślnie), 'full' ogłasza ze wszystkimi metadanymi."
    options:
      off: "Wyłączony (bez mDNS)"
      minimal: "Minimalny (ogłaszanie usługi gateway, domyślnie)"
      full: "Pełny (ogłaszanie ze wszystkimi metadanymi)"
      avahi: "Avahi (OS-level mDNS, tryb gateway wyłączony)"

  mdns_host_name:
    name: Nazwa hosta mDNS
    description: Opcjonalna nazwa hosta dla reklamy mDNS (np. homeassistant.local). Wartość domyślna to "openclaw". Jeśli puste, wykrywana automatycznie z nazwy hosta kontenera.

  gateway_log_to_console:
    name: Pokazuj log Gateway w logu HA
    description: Gdy WŁĄCZONE, wyjście gateway (stdout/stderr) jest duplikowane w oknie logu dodatku Home Assistant oprócz pliku log. Przydatne do diagnostyki w czasie rzeczywistym. Gdy WYŁĄCZONE, logi zapisywane są tylko do pliku.

  gateway_log_level:
    name: Poziom logu Gateway
    description: "Szczegółowość logu Gateway. 'off' pokazuje tylko błędy, 'info' (domyślne) pokazuje normalną operację, 'debug' pokazuje szczegóły do rozwiązywania problemów."
    options:
      off: "Wyłączone (tylko błędy)"
      info: "Info (domyślne)"
      debug: "Debug (szczegółowe)"

  trace_log_to_console:
    name: Pokazuj śledzenie startu w logu HA
    description: Gdy WŁĄCZONE, szczegółowe śledzenie sekwencji startowej (wyjście set -x) jest duplikowane w oknie logu dodatku Home Assistant. Bardzo szczegółowe — włącz tylko do debugowania.

  gateway_env_vars:
    name: Zmienne środowiskowe gateway
    description: Zmienne środowiskowe przekazywane do procesu gateway OpenClaw podczas uruchamiania (lista wpisów name/value w UI Home Assistant; maks. 50 zmiennych, klucze do 255 znaków, wartości do 10000 znaków).

  auto_configure_mcp:
    name: Automatyczna konfiguracja MCP dla Home Assistant
    description: "Gdy WŁĄCZONE i token Home Assistant jest ustawiony, automatycznie rejestruje Home Assistant jako serwer MCP przy każdym starcie. Pozwala to OpenClaw kontrolować urządzenia HA, usługi i automatyzacje przez Model Context Protocol. Wyłącz tylko jeśli zarządzasz konfiguracją mcporter ręcznie."

  runtime_apt_packages:
    name: Pakiety APT w trakcie działania
    description: Opcjonalnie - Lista pakietów APT oddzielonych spacjami do instalacji przy starcie kontenera. Pakiety są ponownie instalowane przy każdym restarcie (nie trwałe w obrazie). Przykład - ffmpeg postgresql-client

  custom_init_script:
    name: Niestandardowy skrypt init
    description: Opcjonalnie - Ścieżka do wykonywalnego skryptu uruchamianego przed OpenClaw. Musi być idempotentny. Zamontuj przez /config/ lub /share/. Przykład - /share/scripts/my-init.sh

  acpx_enabled:
    name: "Infrastruktura ACPX"
    description: "Instaluj launchery wrapperów ACPX (Claude Code, Codex, OpenCode), aby OpenClaw mógł uruchamiać agentów kodujących przez lokalny backend ACPX."

  blocked_hostnames:
    name: "Zablokowane nazwy hostów"
    description: "Lista oddzielona przecinkami zablokowanych nazw hostów dla wychodzącego dostępu sieciowego. Pozostaw puste, aby zezwolić na wszystkie. Przykład - router.lan,192.168.178.1"

  cron_skip_missed_jobs:
    name: "Pomiń pominięte zadania cron"
    description: "Pomijaj pominięte wykonania cron po restarcie zamiast nadrabiać zaległe powtarzające się zadania."

  enable_docs:
    name: "Włącz Docs"
    description: "Pokazuj zakładkę Docs w interfejsie Ingress (dokumentacja statyczna i status na żywo)."

  enable_webui:
    name: "Włącz WebUI"
    description: "Pokazuj zakładkę WebUI w interfejsie Ingress (Panel sterowania OpenClaw)."

  network_mode:
    name: "Tryb sieci"
    description: "Jedno źródło prawdy dla gateway.bind/auth/tls/tailscale. ingress_only - tylko HA Ingress i terminal; lan_http - HTTP w LAN bez TLS; lan_https - HTTPS w LAN z automatycznym TLS; tailnet_serve/tailnet_funnel - HTTPS przez Tailscale; reverse_proxy - zewnętrzny reverse proxy."

  ollama_base_url:
    name: "Bazowy URL Ollama"
    description: "Bazowy URL zdalnej instancji Ollama używany przez wrappery ACPX, gdy nie skonfigurowano kluczy API. Przykład - http://192.168.178.34:11434"
