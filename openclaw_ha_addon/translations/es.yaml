configuration:
  timezone:
    name: Zona horaria
    description: Zona horaria para el complemento (ej. Europe/Berlin, America/New_York)
  network_mode:
    name: Modo de red
    description: Fuente única de verdad para gateway.bind/auth/tls/tailscale. ingress_only - solo HA Ingress y terminal; lan_http
      - HTTP en LAN sin TLS; lan_https - HTTPS en LAN con TLS automático; tailnet_serve/tailnet_funnel - HTTPS de Tailscale;
      reverse_proxy - proxy inverso externo.
  gateway_port:
    name: Puerto del Gateway
    description: Número de puerto en el que el gateway de OpenClaw escuchará (predeterminado - 18789). En los modos LAN y
      Tailscale este es el puerto accesible externamente.
  gateway_env_vars:
    name: Variables de entorno del Gateway
    description: Variables de entorno que se pasan al proceso del gateway OpenClaw al iniciarse (lista de entradas name/value
      en la UI de Home Assistant; máximo 50 variables, claves de hasta 255 caracteres, valores de hasta 10.000 caracteres).
  gateway_mode:
    name: Modo del Gateway
    description: Modo de operación del Gateway - local (ejecutar gateway localmente, recomendado) o remote (conectar a un
      gateway remoto)
    options:
      local: Local (recomendado)
      remote: Remoto
  terminal_port:
    name: Puerto del terminal
    description: Puerto externo del terminal web (predeterminado - 7681). El terminal en sí está siempre activo — aparece
      vía Ingress y es la superficie de mantenimiento/reparación (ruta de escape de la CLI de operador); solo su puerto es
      configurable. Cámbielo si este puerto entra en conflicto con otro servicio.
  enable_webui:
    name: Activar WebUI
    description: Mostrar la pestaña WebUI en la interfaz Ingress (Panel de Control de OpenClaw).
  enable_docs:
    name: Activar Docs
    description: Mostrar la pestaña Docs en la interfaz Ingress (documentación estática y estado en vivo).
  ha_integration:
    name: Home Assistant integration
    description: HA token, MCP, OpenAI API endpoint and proxy
    fields:
      homeassistant_token:
        name: Token de Home Assistant
        description: Opcional - Token de larga duración de Home Assistant para scripts/herramientas de API local
      http_proxy:
        name: Proxy HTTP de salida
        description: Opcional - URL de proxy para solicitudes HTTP/HTTPS salientes (ejemplo - http://192.168.2.1:3128)
      enable_openai_api:
        name: Activar API OpenAI
        description: Activar endpoint de Chat Completions compatible con OpenAI. Permite usar OpenClaw como agente de conversación
          en HA Assist pipeline mediante Extended OpenAI Conversation (HACS) o cualquier cliente compatible con OpenAI.
      auto_configure_mcp:
        name: Configurar MCP automáticamente para Home Assistant
        description: Cuando está ACTIVADO y el token de Home Assistant está configurado, registra automáticamente Home Assistant
          como servidor MCP en cada inicio. Esto permite a OpenClaw controlar entidades, servicios y automatizaciones de HA
          mediante el Model Context Protocol. Desactive solo si administra la configuración de mcporter manualmente.
  acpx_enabled:
    name: Infraestructura ACPX
    description: Instalar lanzadores wrapper ACPX (Claude Code, Codex, OpenCode) para que OpenClaw ejecute agentes de programación
      mediante el backend ACPX local. Los agentes configurados por el usuario se conservan sin cambios.
  harness_config_writer_enabled:
    name: Harness Config Writer
    description: Opcional (Repo-Split A2) - Desplegar + registrar el plugin harness-config-writer incluido (genera la configuración
      nativa de archivos/env de los harnesses a partir de config.harnesses). SIN SETEAR sigue el interruptor de ACP Dashboard
      Binding; ACTIVADO lo fuerza aunque el binding esté apagado; DESACTIVADO lo mantiene apagado de forma permanente. La
      primera sesión activada hace una instantánea de los archivos gestionados — apagarlo de nuevo restaura los originales
      automáticamente.
  harness:
    name: Harness (backends de código)
    description: Defaults compartidos de proveedor/modelo para los harnesses acpx incluidos (Claude Code, Codex, OpenCode)
      y el harness-config-writer. El endpoint es cualquier API compatible con OpenAI — no solo Ollama.
    fields:
      harness_base_url:
        name: URL base de Harness
        description: Endpoint backend para TODOS los harnesses locales (cualquier API compatible con OpenAI — no solo Ollama),
          ej. http://192.168.178.34:11434. También es el ACTIVADOR del harness-config-writer - vacío no genera nada (los
          registros del operador quedan intactos). Sin valor se usa el fallback integrado http://localhost:11434.
      harness_api_key:
        name: Clave API de Harness
        description: Clave API usada por los registros de harness generados (default compartido del writer). Vacío = sin clave
          (ej. Ollama local).
      harness_model:
        name: Modelo por defecto (todos los harnesses)
        description: Modelo por defecto compartido. Se aplica a todos los harnesses NO excluidos (codex/opencode/claude conservan
          sus modelos individuales debajo), si está definido. Vacío = ganan los defaults individuales.
      utility_model:
        name: Modelo Utility
        description: Opcional - Override para agents.defaults.utilityModel en openclaw.json (el modelo detrás de las llamadas
          utility internas del gateway, en particular el observador de sesión). SIN SETEAR = sin escritura (operator owns
          the value); configúrelo solo con un modelo de salida estrictamente JSON válido.
      harness_opencode_model:
        name: Modelo OpenCode (forge)
        description: Opcional - Modelo del harness OpenCode (forge). Predeterminado - glm-5.3-flash:cloud
      harness_claude_model:
        name: Modelo Claude Code
        description: Opcional - Modelo del harness Claude Code (también alimenta el fallback ANTHROPIC_MODEL ambient).
          Predeterminado - glm-5.3-flash:cloud
      harness_codex_model:
        name: Modelo Codex (audit)
        description: Opcional - Modelo del harness Codex (audit). Predeterminado - kimi-k2.7-code:cloud
      harness_excluded_agents:
        name: Harnesses excluidos
        description: Opcional - Lista separada por comas de IDs de harness EXCLUIDOS de los defaults compartidos de arriba
          (ej. "codex,opencode").
      additional_agents:
        name: Agentes adicionales
        description: Opcional - Lista separada por comas de nombres ADICIONALES de agentes/harnesses para acp.allowedAgents
          además de los incluidos claude/codex/opencode/openclaw (ej. "pi,colibri,gemini"). Los agentes personalizados también
          deben existir en el roster de OpenClaw con runtime.type=acp; la lista solo se une, nunca se sobrescribe.
      acp_dashboard_binding_enabled:
        name: ACP Dashboard Binding
        description: Opcional (Fase 2.15) - Desplegar + registrar el plugin acp-dashboard-binding incluido (resuelve conversaciones
          de dashboard/webchat en sesiones de harness ACP). ACTIVADO por defecto — el binding es la superficie central del
          complemento; DESACTIVADO para un opt-out real del operador.
  gateway_ext:
    name: Gateway (external)
    description: URLs, trusted proxies and allowed origins for gateway access
    fields:
      gateway_public_url:
        name: URL pública del Gateway
        description: URL base pública para abrir la interfaz web del Gateway en una nueva pestaña (no integrada). Ejemplo
          - https://ejemplo.duckdns.org:12345 o http://192.168.1.10:18789
      gateway_remote_url:
        name: URL del Gateway Remoto
        description: URL WebSocket del gateway remoto utilizada cuando Gateway Mode es Remote (ejemplo - ws://192.168.1.20:18789
          o wss://gateway.example.com:443)
      gateway_trusted_proxies:
        name: Proxys de confianza del Gateway
        description: Lista de IPs/CIDR de proxys de confianza separados por comas para el modo trusted-proxy (ejemplo - 127.0.0.1,192.168.88.0/24).
      gateway_additional_allowed_origins:
        name: Orígenes permitidos adicionales
        description: Orígenes extra de Control UI separados por comas que se combinan en gateway.controlUi.allowedOrigins
          en modo lan_https (ejemplo - https://ha.example.com:8443,capacitor://localhost)
  logging_diag:
    name: Logging & diagnostics
    description: Console mirroring, log levels, startup trace, nginx, DNS and mDNS
    fields:
      gateway_log_to_console:
        name: Mostrar log del Gateway en log de HA
        description: Cuando está ACTIVADO, la salida del gateway (stdout/stderr) se refleja en la ventana de log del complemento
          de Home Assistant además del archivo de log. Útil para diagnóstico en tiempo real. Cuando está DESACTIVADO, los
          logs se escriben solo en el archivo.
      gateway_log_level:
        name: Nivel de log del Gateway
        description: Verbosidad del log del Gateway. 'off' muestra solo errores, 'info' (predeterminado) muestra operación
          normal, 'debug' muestra detalles detallados para solución de problemas.
        options:
          false: Desactivado (solo errores)
          info: Info (predeterminado)
          debug: Debug (detallado)
      trace_log_to_console:
        name: Mostrar traza de arranque en log de HA
        description: Cuando está ACTIVADO, la secuencia de arranque detallada (salida set -x) se refleja en la ventana de
          log del complemento de Home Assistant. Muy detallado — activar solo para depuración.
      gateway_startup_trace:
        name: Traza de startup en el log del app
        description: Opcional (diagnóstico, DESACTIVADO por defecto) - Cuando está ACTIVADO, el log de arranque muestra el
          reparto de tiempos por fase/plugin ("startup trace - plugin ... ms"). Herramienta para analizar arranques lentos
          tras producirse. Activar, reiniciar, leer el log y desactivar.
      nginx_log_level:
        name: Nivel de log Nginx
        description: Nivel de detalle del log de acceso de nginx. 'minimal' (por defecto) suprime las solicitudes repetitivas
          de health-check y polling de HA. 'full' registra todo.
        options:
          minimal: Mínimo (suprimir ruido de polling HA)
          full: Completo (registrar todas las solicitudes)
      force_ipv4_dns:
        name: Forzar orden DNS IPv4
        description: Fuerza prioridad IPv4 en DNS. La mayoría de VMs HAOS no tienen salida IPv6 — causa errores en web_fetch
          y Telegram. Recomendado ACTIVADO (por defecto).
      mdns_mode:
        name: Modo mDNS
        description: Configuración mDNS/Bonjour para descubrimiento en LAN. 'off' desactiva mDNS, 'minimal' anuncia el servicio
          gateway (predeterminado), 'full' anuncia con todos los metadatos.
        options:
          false: Desactivado (sin mDNS)
          minimal: Mínimo (anunciar servicio gateway, predeterminado)
          full: Completo (anunciar con todos los metadatos)
      mdns_host_name:
        name: Nombre de host mDNS
        description: Nombre de host opcional para anuncio mDNS (ej. homeassistant.local). El valor predeterminado es "openclaw".
          Si está vacío, se detecta automáticamente desde el nombre de host del contenedor.
  safety_nets:
    name: Safety nets
    description: Upgrade state backups and automatic gateway repair
    fields:
      abort_on_upgrade_backup_failure:
        name: Abortar si falla la copia previa a la actualización
        description: Si está ACTIVADO (recomendado), la app no arrancará una nueva versión de OpenClaw si falla la copia de
          seguridad previa (p. ej. disco lleno). Desactivar solo en emergencias; entonces puede ser imposible volver a la
          versión anterior.
      upgrade_backup_keep:
        name: Copias de actualización a conservar
        description: Cuántas copias previas a la actualización se conservan antes de borrar la más antigua (por defecto 3).
      gateway_doctor_repair_max:
        name: Reparaciones doctor por arranque
        description: Máximo de ejecuciones automáticas de `openclaw doctor --fix` por arranque de la app tras 2 inicios fallidos
          consecutivos del gateway. 0 desactiva la reparación automática.
  runtime:
    name: Runtime
    description: Apt packages, custom init script and SSRP hostname blocklist
    fields:
      runtime_apt_packages:
        name: Paquetes APT en tiempo de ejecución
        description: Opcional - Lista de paquetes APT separados por espacios para instalar al iniciar el contenedor. Los paquetes
          se reinstalan en cada reinicio (no persistentes en la imagen). Ejemplo - ffmpeg postgresql-client
      custom_init_script:
        name: Script de init personalizado
        description: Opcional - Ruta a un script ejecutable que se ejecuta antes de OpenClaw. Debe ser idempotente. Monte
          mediante /config/ o /share/. Ejemplo - /share/scripts/my-init.sh
      blocked_hostnames:
        name: Nombres de host bloqueados
        description: Lista separada por comas de nombres de host bloqueados para el acceso de red saliente. Dejar vacío para
          permitir todos. Ejemplo - router.lan,192.168.178.1
  legacy:
    name: Legacy
    description: Retired options kept for compatibility
    fields:
      controlui_disable_device_auth:
        name: Obsoleta — sin efecto (el emparejamiento siempre es por flujo de dispositivo)
        description: Opción obsoleta (se mantiene por compatibilidad). Desde OpenClaw 2026.9.8, el flag gateway.controlUi.dangerouslyDisableDeviceAuth
          ha sido retirado e ignorado por upstream, y la aplicación ya no lo escribe en la configuración del gateway. Los
          navegadores del Control-UI siempre se emparejan mediante el flujo de dispositivo normal en cualquier modo de red;
          no se requieren pasos manuales en el terminal.